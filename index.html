<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Remote Piano v1.3.8</title>
  <style>
    body { background:#111; color:#fff; display:flex; flex-direction:column; height:100vh; margin:0; overflow:hidden; font-family:sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
    header { padding:15px 25px; display:flex; justify-content:space-between; align-items:center; background:#1a1a1a; border-bottom:1px solid #333; z-index:10; box-shadow:0 4px 10px rgba(0,0,0,0.5); }
    .logo { font-size:22px; font-weight:bold; color:#0f8; letter-spacing:1px; }
    .control-group { display:flex; gap:10px; align-items:center; }
    input { padding:10px 15px; background:#222; border:1px solid #444; color:#fff; border-radius:5px; font-size:14px; outline:none; transition:0.2s; }
    button { padding:10px 20px; border:none; border-radius:5px; font-weight:bold; font-size:14px; cursor:pointer; }
    .btn-create { background:#0f8; color:#000; }
    .btn-join { background:#0ea5e9; color:#fff; }
    .btn-leave { background:#ff4444; color:#fff; }
    .status-wrap { display:flex; align-items:center; gap:15px; background:rgba(0,0,0,0.5); padding:8px 15px; border-radius:10px; border:1px solid #333; }
    #net-mode { font-size:12px; font-weight:bold; color:#888; }
    #net-ping { font-size:14px; font-weight:bold; color:#888; font-family:monospace; }
    #users { padding:20px; display:flex; gap:20px; flex-wrap:wrap; justify-content:center; min-height:40px; }
    .u-card { background:#2a2a2a; padding:12px 25px; border-radius:30px; display:flex; align-items:center; gap:10px; border:1px solid #555; font-size:18px; font-weight:bold; }
    .u-dot { width:12px; height:12px; background:#555; border-radius:50%; transition:0.1s; }
    .u-dot.act { background:#0f8; box-shadow:0 0 10px #0f8; transform:scale(1.3); }
    #piano { flex:1; display:flex; align-items:flex-start; padding-top:60px; justify-content:center; position:relative; overflow-x:auto; background:linear-gradient(to bottom, #111, #050505); }
    .k { position:relative; border-radius:0 0 5px 5px; cursor:pointer; transition:background 0.05s; }
    .w { width:38px; height:240px; background:#fff; border:1px solid #ccc; z-index:1; margin-right:-1px; }
    .w.on { background:#ffe600 !important; box-shadow:0 0 15px rgba(255,230,0,0.5); }
    .b { width:24px; height:150px; background:#000; margin:0 -12px 90px -12px; z-index:2; border:1px solid #222; }
    .b.on { background:#ffe600 !important; box-shadow:0 0 15px rgba(255,230,0,0.5); }
  </style>
</head>
<body onclick="if(audio.state==='suspended')audio.resume()">

<header>
  <div class="logo">🎹 Remote Piano</div>
  <div class="control-group" id="login-form">
    <input id="rn" placeholder="방 이름" autocomplete="off">
    <input id="pw" type="password" placeholder="비번(4자리)" maxlength="4">
    <input id="nm" placeholder="닉네임" autocomplete="off">
    <button class="btn-create" onclick="createRoom()">방 만들기</button>
    <button class="btn-join" onclick="joinRoom()">방 접속</button>
  </div>
  <div class="control-group" id="connected-ui" style="display:none;">
    <div id="room-name-display" style="font-weight:bold; color:#0f8; font-size:16px; margin-right:15px; letter-spacing:1px;"></div>
    <div class="status-wrap"><div id="net-mode">대기중</div><div id="net-ping">-- ms</div></div>
    <button class="btn-leave" onclick="location.reload()">접속 끊기</button>
  </div>
</header>

<div id="users"></div>
<div id="piano"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const audio = new (window.AudioContext||window.webkitAudioContext)();
  const socket = io();
  const oscs = {}, gains = {};
  let midiOutputs = []; 
  const echoBlock = {}; 
  const peers = {}; 
  const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }; 

  let isSustainOn = false;
  let sustainedNotes = new Set();

  // [v1.3.8] 통합 신호 처리 (나와 남의 신호 공통 적용)
  function processMIDI(s, n, v, senderId) {
    const type = s & 0xf0;

    // 1. 페달 처리 (CC 64)
    if (type === 0xb0 && n === 64) {
      isSustainOn = v >= 64;
      if (!isSustainOn) {
        sustainedNotes.forEach(note => stopSound(note));
        sustainedNotes.clear();
      }
    } 
    // 2. Note On
    else if (type === 0x90 && v > 0) {
      playKey(n, v);
    } 
    // 3. Note Off
    else {
      // 불빛은 페달 여부와 상관없이 즉시 끕니다 (잔상 방지)
      const k = document.getElementById('k'+n);
      if(k) k.classList.remove('on');

      if (isSustainOn) sustainedNotes.add(n); else stopSound(n);
    }
    
    if(senderId) flash(senderId);
  }

  function playKey(n, v) {
    if(oscs[n]) stopSound(n);
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = 'triangle';
    o.frequency.value = 440 * Math.pow(2, (n-69)/12);
    const vol = (v/127) * 0.4;
    g.gain.setValueAtTime(0, audio.currentTime);
    g.gain.linearRampToValueAtTime(vol, audio.currentTime + 0.005);
    g.gain.exponentialRampToValueAtTime(vol * 0.1, audio.currentTime + 1.2);
    o.connect(g); g.connect(audio.destination);
    o.start();
    oscs[n]=o; gains[n]=g;
    document.getElementById('k'+n)?.classList.add('on');
    sustainedNotes.delete(n);
  }

  function stopSound(n) {
    if(gains[n]) {
      gains[n].gain.setTargetAtTime(0, audio.currentTime, 0.04);
      const o = oscs[n];
      setTimeout(()=>{ if(o) { o.stop(); o.disconnect(); } }, 200);
    }
    delete oscs[n]; delete gains[n];
    document.getElementById('k'+n)?.classList.remove('on');
  }

  function tx(s, n, v) {
    if(audio.state === 'suspended') audio.resume();
    processMIDI(s, n, v); 
    
    const msg = [s, n, v];
    const msgStr = JSON.stringify(msg);
    for (const id in peers) {
      const ch = peers[id].dc;
      if (ch && ch.readyState === 'open') ch.send(msgStr);
    }
    if (window.currentRoom) socket.emit('midi-msg', { roomName: window.currentRoom, msg });
  }

  const p = document.getElementById('piano');
  for(let i=21; i<=108; i++) {
    const isB = [1,3,6,8,10].includes(i%12);
    const d = document.createElement('div');
    d.id = 'k'+i; d.className = `k ${isB?'b':'w'}`;
    d.onmousedown = (e) => { e.preventDefault(); tx(144, i, 100); };
    d.onmouseenter = (e) => { if(e.buttons === 1) tx(144, i, 100); };
    d.onmouseleave = () => tx(128, i, 0); // 글리산도 잔상 방지
    d.onmouseup = () => tx(128, i, 0);
    d.ontouchstart = (e) => { e.preventDefault(); tx(144, i, 100); };
    d.ontouchend = (e) => { e.preventDefault(); tx(128, i, 0); };
    p.appendChild(d);
  }

  function createRoom() {
    const r = document.getElementById('rn').value, pw = document.getElementById('pw').value, n = document.getElementById('nm').value;
    if(!r || !pw || !n) return;
    socket.emit('create-room', { roomName: r, userName: n, password: pw });
    window.currentRoom = r;
  }

  function joinRoom() {
    const r = document.getElementById('rn').value, pw = document.getElementById('pw').value, n = document.getElementById('nm').value;
    if(!r || !pw || !n) return;
    socket.emit('join-room', { roomName: r, userName: n, password: pw });
    window.currentRoom = r;
  }

  socket.on('join-success', d => {
    document.getElementById('login-form').style.display = 'none';
    document.getElementById('connected-ui').style.display = 'flex';
    document.getElementById('room-name-display').innerText = `[ ${d.roomName} ]`;
    d.users.forEach(addU);
  });

  socket.on('remote-midi', d => {
    if (echoBlock[`${d.msg[0]}-${d.msg[1]}`] && Date.now() - echoBlock[`${d.msg[0]}-${d.msg[1]}`] < 100) return;
    processMIDI(d.msg[0], d.msg[1], d.msg[2], d.id);
    midiOutputs.forEach(out => out.send(d.msg));
  });

  function setupPeer(id, init) {
    const pc = new RTCPeerConnection(rtcConfig);
    peers[id] = { pc };
    pc.onicecandidate = e => { if(e.candidate) socket.emit('webrtc-signal', { to: id, signal: { candidate: e.candidate } }); };
    const dcH = (dc) => {
      peers[id].dc = dc;
      dc.onmessage = e => {
        const m = JSON.parse(e.data);
        echoBlock[`${m[0]}-${m[1]}`] = Date.now();
        processMIDI(m[0], m[1], m[2], id);
        midiOutputs.forEach(out => out.send(m));
      };
      dc.onopen = () => document.getElementById('net-mode').innerText = "P2P 🟢";
    };
    if(init) { const dc = pc.createDataChannel('midi'); dcH(dc); pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => socket.emit('webrtc-signal', { to: id, signal: { offer: pc.localDescription } })); }
    else pc.ondatachannel = e => dcH(e.channel);
  }

  socket.on('user-joined', u => { addU(u); setupPeer(u.id, true); });
  socket.on('webrtc-signal', async d => {
    const pc = peers[d.from]?.pc || setupPeer(d.from, false).pc;
    if (signal.offer) { await pc.setRemoteDescription(new RTCSessionDescription(signal.offer)); const ans = await pc.createAnswer(); await pc.setLocalDescription(ans); socket.emit('webrtc-signal', { to: d.from, signal: { answer: pc.localDescription } }); }
    else if (signal.answer) await pc.setRemoteDescription(new RTCSessionDescription(signal.answer));
    else if (signal.candidate) await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
  });

  socket.on('ping-res', t => document.getElementById('net-ping').innerText = (Date.now() - t) + " ms");
  setInterval(() => window.currentRoom && socket.emit('ping-req', Date.now()), 2000);
  function addU(u) { if(!document.getElementById('u-'+u.id)) { const d = document.createElement('div'); d.className = 'u-card'; d.id='u-'+u.id; d.innerHTML=`<span class=\"u-dot\" id=\"d-${u.id}\"></span>${u.name}`; document.getElementById('users').appendChild(d); } }
  function flash(id) { const d = document.getElementById('d-'+id); if(d) { d.classList.add('act'); setTimeout(()=>d.classList.remove('act'), 100); } }
  socket.on('user-left', id => document.getElementById('u-'+id)?.remove());

  if(navigator.requestMIDIAccess) {
    navigator.requestMIDIAccess().then(m => { 
      for(let i of m.inputs.values()) i.onmidimessage = e => {
        if (echoBlock[`${e.data[0]}-${e.data[1]}`] && Date.now() - echoBlock[`${e.data[0]}-${e.data[1]}`] < 100) return;
        tx(e.data[0], e.data[1], e.data[2]);
      };
      for(let o of m.outputs.values()) midiOutputs.push(o);
    });
  }
</script>
</body>
</html>
