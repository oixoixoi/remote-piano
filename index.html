<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Remote Piano</title>
  <style>
    body { background:#111; color:#fff; display:flex; flex-direction:column; height:100vh; margin:0; overflow:hidden; font-family:sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
    
    header { padding:20px 25px; display:flex; flex-direction:column; gap:20px; background:#1a1a1a; border-bottom:1px solid #333; z-index:10; box-shadow:0 4px 10px rgba(0,0,0,0.5); }
    .header-top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; }
    .logo { font-size:24px; font-weight:bold; color:#0f8; letter-spacing:1px; }
    
    .control-group { display:flex; gap:10px; align-items:center; }
    input { padding:12px 15px; background:#222; border:1px solid #444; color:#fff; border-radius:6px; font-size:14px; outline:none; transition:0.2s; width:140px; }
    input:focus { border-color:#0f8; }
    input[readonly] { color:#0f8; font-weight:bold; cursor:not-allowed; background:#151515; } 
    
    button { padding:12px 22px; border:none; border-radius:6px; font-weight:bold; font-size:14px; cursor:pointer; transition:0.2s; }
    .btn-create { background:#0f8; color:#000; } 
    .btn-create:hover { background:#0c6; }
    .btn-join { background:#0ea5e9; color:#fff; } 
    .btn-join:hover { background:#0284c7; }
    .btn-leave { background:#ff4444; color:#fff; }
    .btn-leave:hover { background:#cc0000; }

    .lobby-area { display:flex; gap:15px; align-items:center; }
    .lobby-label { color:#888; font-size:13px; font-weight:bold; white-space:nowrap; }
    #active-rooms { display:flex; gap:10px; flex-wrap:wrap; }
    .room-tag { padding:6px 15px; background:#2a2a2a; border:1px solid #444; border-radius:15px; cursor:pointer; font-size:13px; color:#ccc; transition:0.2s; }
    .room-tag:hover { background:#333; border-color:#0f8; color:#0f8; }

    .status-wrap { display:flex; align-items:center; gap:15px; background:rgba(0,0,0,0.6); padding:8px 18px; border-radius:10px; border:1px solid #333; }
    .net-info { text-align:right; display:flex; flex-direction:column; gap:2px; }
    #net-mode { font-size:12px; font-weight:bold; }
    #net-ping { font-size:14px; font-weight:bold; font-family:monospace; }
    
    #users { padding:15px; display:flex; gap:15px; flex-wrap:wrap; justify-content:center; min-height:50px; }
    .u-card { background:#252525; padding:10px 20px; border-radius:25px; display:flex; align-items:center; gap:10px; border:1px solid #444; font-size:16px; font-weight:bold; }
    .u-dot { width:10px; height:10px; background:#444; border-radius:50%; }
    .u-dot.act { background:#0f8; box-shadow:0 0 8px #0f8; transform:scale(1.2); }
    
    #piano { flex:1; display:flex; align-items:flex-start; padding-top:40px; justify-content:center; position:relative; overflow-x:auto; background:linear-gradient(to bottom, #111, #000); }
    
    .k { position:relative; border-radius:0 0 5px 5px; cursor:pointer; transition:background 0.05s; -webkit-user-drag:none; }
    .w { width:38px; height:240px; background:#fff; border:1px solid #ccc; z-index:1; }
    /* 클래스 .on이 붙었을 때만 노란색 유지 */
    .w.on { background:#ffe600 !important; box-shadow:0 0 15px rgba(255,230,0,0.5); }
    .b { width:24px; height:150px; background:#000; margin:0 -12px 90px -12px; z-index:2; border:1px solid #222; }
    .b.on { background:#ffe600 !important; box-shadow:0 0 15px rgba(255,230,0,0.5); }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo">🎹 Remote Piano</div>
    <div class="control-group" id="login-form">
      <input id="rn" placeholder="방 이름" autocomplete="off">
      <input id="pw" type="text" placeholder="비밀번호(4자리)" maxlength="4" autocomplete="off" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
      <input id="nm" placeholder="닉네임" autocomplete="off">
      <button id="btn-action" class="btn-create" onclick="createRoom()">방 만들기</button>
      <button id="btn-cancel" class="btn-leave" style="display:none;" onclick="resetLobbyMode()">취소</button>
    </div>
    <div class="control-group" id="connected-ui" style="display:none;">
      <div id="room-name-display" style="font-weight:bold; color:#0f8; font-size:18px; margin-right:10px;"></div>
      <div class="status-wrap">
        <div class="net-info">
          <div id="net-mode">연결 대기중</div>
          <div id="net-ping">-- ms</div>
        </div>
      </div>
      <button class="btn-leave" onclick="location.reload()">접속 끊기</button>
    </div>
  </div>
  <div class="lobby-area" id="lobby-wrap">
    <span class="lobby-label">🟢 열려있는 방:</span>
    <div id="active-rooms">
      <span style="color:#444; font-size:13px;">진행 중인 방이 없습니다.</span>
    </div>
  </div>
</header>

<div id="users"></div>
<div id="piano"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const audio = new (window.AudioContext||window.webkitAudioContext)();
  const socket = io();
  const oscs = {}, gains = {};
  const echoBlock = {}; 
  const peers = {}; 
  const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }; 

  // 핵심: 불빛 제어를 무조건 play/stop 함수 내부에서만 하도록 단일화
  function play(n, v) {
    // 1. 이미 나고 있는 소리나 불빛이 있다면 끄고 시작
    if(oscs[n]) stop(n);

    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = 'triangle';
    o.frequency.value = 440 * Math.pow(2, (n-69)/12);
    const vol = (v/127) * 0.4;
    g.gain.setValueAtTime(0, audio.currentTime);
    g.gain.linearRampToValueAtTime(vol, audio.currentTime + 0.005); 
    g.gain.exponentialRampToValueAtTime(vol * 0.1, audio.currentTime + 1.5);
    o.connect(g); g.connect(audio.destination);
    o.start();
    oscs[n]=o; gains[n]=g;

    // 시각 효과 추가
    const k = document.getElementById('k'+n);
    if(k) k.classList.add('on');
  }

  function stop(n) {
    if(!oscs[n]) {
      // 소리는 없는데 불빛만 남아있는 예외 상황을 위해 강제로 클래스 제거
      const k = document.getElementById('k'+n);
      if(k) k.classList.remove('on');
      return;
    }

    if(gains[n]) {
      gains[n].gain.cancelScheduledValues(audio.currentTime);
      gains[n].gain.setValueAtTime(gains[n].gain.value, audio.currentTime);
      gains[n].gain.linearRampToValueAtTime(0, audio.currentTime + 0.03); 
    }
    const o = oscs[n];
    setTimeout(()=>{ if(o) { o.stop(); o.disconnect(); } }, 40);
    delete oscs[n]; delete gains[n];

    // 시각 효과 제거
    const k = document.getElementById('k'+n);
    if(k) k.classList.remove('on');
  }

  function tx(s, n, v) {
    if(audio.state === 'suspended') audio.resume();
    if(s===144 && v>0) play(n,v); else stop(n);
    
    let sentP2P = false;
    const msgStr = JSON.stringify([s, n, v]);
    for (const peerId in peers) {
      const channel = peers[peerId].dataChannel;
      if (channel && channel.readyState === 'open') { channel.send(msgStr); sentP2P = true; }
    }
    if (!sentP2P && window.currentRoom) socket.emit('midi-msg', { roomName: window.currentRoom, msg: [s, n, v] });
  }

  const pianoEl = document.getElementById('piano');
  for(let i=21; i<=108; i++) {
    const isB = [1,3,6,8,10].includes(i%12);
    const d = document.createElement('div');
    d.id = 'k'+i; d.className = `k ${isB?'b':'w'}`;
    d.draggable = false; 
    pianoEl.appendChild(d);
  }

  // 마우스 추적 (전체 화면 기준)
  let currentActiveNote = null;

  pianoEl.addEventListener('mousedown', (e) => {
    const k = e.target.closest('.k');
    if(k) {
      e.preventDefault();
      const note = parseInt(k.id.replace('k',''));
      currentActiveNote = note;
      tx(144, note, 100);
    }
  });

  pianoEl.addEventListener('mouseover', (e) => {
    if(e.buttons !== 1) return; 
    const k = e.target.closest('.k');
    if(k) {
      const note = parseInt(k.id.replace('k',''));
      if(currentActiveNote !== note) {
        if(currentActiveNote) tx(128, currentActiveNote, 0); 
        currentActiveNote = note;
        tx(144, note, 100);
      }
    }
  });

  // 화면 어디서든 떼면 소리와 불빛 모두 종료
  window.addEventListener('mouseup', () => {
    if(currentActiveNote) {
      tx(128, currentActiveNote, 0);
      currentActiveNote = null;
    }
  });

  // 피아노 영역 이탈 시 즉각 종료
  pianoEl.addEventListener('mouseleave', () => {
    if(currentActiveNote) {
      tx(128, currentActiveNote, 0);
      currentActiveNote = null;
    }
  });

  const activeTouches = {};
  pianoEl.addEventListener('touchstart', (e) => {
    e.preventDefault();
    for (let touch of e.changedTouches) {
      const elem = document.elementFromPoint(touch.clientX, touch.clientY);
      if (elem && elem.classList.contains('k')) {
        const note = parseInt(elem.id.replace('k',''));
        activeTouches[touch.identifier] = note;
        tx(144, note, 100);
      }
    }
  }, {passive: false});

  pianoEl.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (let touch of e.changedTouches) {
      const elem = document.elementFromPoint(touch.clientX, touch.clientY);
      const prevNote = activeTouches[touch.identifier];
      if (elem && elem.classList.contains('k')) {
        const currentNote = parseInt(elem.id.replace('k',''));
        if (prevNote !== currentNote) {
          if (prevNote) tx(128, prevNote, 0);
          activeTouches[touch.identifier] = currentNote;
          tx(144, currentNote, 100);
        }
      } else {
        if(prevNote) { tx(128, prevNote, 0); delete activeTouches[touch.identifier]; }
      }
    }
  }, {passive: false});

  const handleTouchEnd = (e) => {
    e.preventDefault();
    for (let touch of e.changedTouches) {
      const prevNote = activeTouches[touch.identifier];
      if (prevNote) { tx(128, prevNote, 0); delete activeTouches[touch.identifier]; }
    }
  };
  pianoEl.addEventListener('touchend', handleTouchEnd, {passive: false});

  socket.on('room-list', rooms => {
    const container = document.getElementById('active-rooms');
    if(rooms.length === 0) { container.innerHTML = '<span style="color:#444; font-size:13px;">진행 중인 방이 없습니다.</span>'; return; }
    container.innerHTML = '';
    rooms.forEach(r => { const btn = document.createElement('div'); btn.className = 'room-tag'; btn.innerText = r; btn.onclick = () => selectRoom(r); container.appendChild(btn); });
  });

  function selectRoom(roomName) {
    document.getElementById('rn').value = roomName; document.getElementById('rn').readOnly = true; 
    const btnAction = document.getElementById('btn-action'); btnAction.innerText = "방 접속"; btnAction.className = "btn-join"; btnAction.onclick = joinRoom;
    document.getElementById('btn-cancel').style.display = 'inline-block'; document.getElementById('pw').focus(); 
  }
  function resetLobbyMode() {
    document.getElementById('rn').value = ''; document.getElementById('rn').readOnly = false;
    const btnAction = document.getElementById('btn-action'); btnAction.innerText = "방 만들기"; btnAction.className = "btn-create"; btnAction.onclick = createRoom;
    document.getElementById('btn-cancel').style.display = 'none';
  }

  function validateInput() {
    const r = document.getElementById('rn').value.trim(), pw = document.getElementById('pw').value.trim(), n = document.getElementById('nm').value.trim();
    if(!r || !pw || !n) { alert("빈칸을 모두 채워주세요!"); return null; }
    if(!/^\d{4}$/.test(pw)) { alert("비밀번호는 숫자 4자리여야 합니다."); return null; }
    return { r, pw, n };
  }

  function createRoom() { const data = validateInput(); if(!data) return; socket.emit('create-room', { roomName: data.r, userName: data.n, password: data.pw }); window.currentRoom = data.r; }
  function joinRoom() { const data = validateInput(); if(!data) return; socket.emit('join-room', { roomName: data.r, userName: data.n, password: data.pw }); window.currentRoom = data.r; }

  socket.on('join-success', d => {
    document.getElementById('login-form').style.display = 'none'; document.getElementById('lobby-wrap').style.display = 'none'; 
    document.getElementById('connected-ui').style.display = 'flex'; document.getElementById('room-name-display').innerText = `[ ${d.roomName} ]`; upd(d.users);
  });
  socket.on('error-msg', m => { alert(m); window.currentRoom = null; });
  socket.on('user-left', id => { document.getElementById('u-'+id)?.remove(); if(peers[id]) { peers[id].pc.close(); delete peers[id]; } });
  socket.on('remote-midi', d => { 
    const [s,n,v] = d.msg; 
    echoBlock[`${s}-${n}`] = Date.now(); 
    if(s===144 && v>0) play(n,v); else stop(n); 
    flash(d.id); 
    midiOutputs.forEach(output => { try { output.send([s, n, v]); } catch(e) {} }); 
  });
  socket.on('user-activity', d => flash(d.id));

  function updatePing(ms) {
    const pingEl = document.getElementById('net-ping');
    const modeEl = document.getElementById('net-mode');
    pingEl.innerText = ms + " ms";
    pingEl.style.color = ms < 50 ? "#0f8" : (ms < 150 ? "#ffeb3b" : "#ff4444");
  }

  socket.on('ping-res', t => updatePing(Date.now() - t));
  setInterval(() => {
    if(!window.currentRoom) return;
    let p2pActive = false;
    for(const p in peers) { if(peers[p].dataChannel && peers[p].dataChannel.readyState === 'open') p2pActive = true; }
    const modeEl = document.getElementById('net-mode');
    if(p2pActive) {
      modeEl.innerText = "직통연결 ⚡"; modeEl.style.color = "#0f8";
      for(const p in peers) { const dc = peers[p].dataChannel; if(dc && dc.readyState === 'open') dc.send(JSON.stringify(['ping', Date.now()])); }
    } else {
      modeEl.innerText = "우회연결 ☁️"; modeEl.style.color = "#ffb74d";
      socket.emit('ping-req', Date.now());
    }
  }, 2000);

  function setupPeerConnection(peerId, initiate) {
    const pc = new RTCPeerConnection(rtcConfig); peers[peerId] = { pc: pc, dataChannel: null };
    pc.onicecandidate = event => { if (event.candidate) socket.emit('webrtc-signal', { to: peerId, signal: { candidate: event.candidate } }); };
    const setupDataChannel = (channel) => {
      peers[peerId].dataChannel = channel;
      channel.onmessage = event => {
        const data = JSON.parse(event.data);
        if(data[0] === 'ping') { channel.send(JSON.stringify(['pong', data[1]])); return; }
        if(data[0] === 'pong') { updatePing(Date.now() - data[1]); return; }
        const [s, n, v] = data; echoBlock[`${s}-${n}`] = Date.now(); if(s===144 && v>0) play(n,v); else stop(n); flash(peerId); midiOutputs.forEach(output => { try { output.send([s, n, v]); } catch(e) {} });
      };
    };
    if (initiate) { const dc = pc.createDataChannel('midi'); setupDataChannel(dc); pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() => socket.emit('webrtc-signal', { to: peerId, signal: { offer: pc.localDescription } })); } 
    else { pc.ondatachannel = event => setupDataChannel(event.channel); }
  }

  socket.on('user-joined', user => { addU(user); setupPeerConnection(user.id, true); });
  socket.on('webrtc-signal', async data => {
    const { from, signal } = data; if (!peers[from]) setupPeerConnection(from, false); const pc = peers[from].pc;
    if (signal.offer) { await pc.setRemoteDescription(new RTCSessionDescription(signal.offer)); const answer = await pc.createAnswer(); await pc.setLocalDescription(answer); socket.emit('webrtc-signal', { to: from, signal: { answer: pc.localDescription } }); } 
    else if (signal.answer) { await pc.setRemoteDescription(new RTCSessionDescription(signal.answer)); } else if (signal.candidate) { await pc.addIceCandidate(new RTCIceCandidate(signal.candidate)); }
  });

  function upd(us) { document.getElementById('users').innerHTML=''; us.forEach(addU); }
  function addU(u) { if(document.getElementById('u-'+u.id)) return; const d = document.createElement('div'); d.className = 'u-card'; d.id='u-'+u.id; d.innerHTML=`<span class="u-dot" id="d-${u.id}"></span>${u.name}`; document.getElementById('users').appendChild(d); }
  function flash(id) { const d = document.getElementById('d-'+id); if(d) { d.classList.add('act'); setTimeout(()=>d.classList.remove('act'), 100); } }
  
  if(navigator.requestMIDIAccess) {
    navigator.requestMIDIAccess().then(m => { 
      for(let i of m.inputs.values()) { i.onmidimessage = e => { const [s, n, v] = e.data; if (echoBlock[`${s}-${n}`] && Date.now() - echoBlock[`${s}-${n}`] < 100) return; tx(s, n, v); }; }
      for(let o of m.outputs.values()) midiOutputs.push(o);
    });
  }
</script>
</body>
</html>
