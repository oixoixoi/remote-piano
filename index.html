<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Remote Piano v1.3.7</title>
  <style>
    body { background:#000; color:#eee; margin:0; font-family:sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; touch-action:none; }
    header { padding:10px 20px; display:flex; justify-content:space-between; align-items:center; background:#111; border-bottom:1px solid #222; }
    .logo { color:#0f8; font-weight:bold; font-size:18px; }
    .control-group { display:flex; gap:8px; }
    input { padding:8px; background:#222; border:1px solid #333; color:#fff; border-radius:4px; width:80px; }
    button { padding:8px 15px; border:none; border-radius:4px; cursor:pointer; font-weight:bold; }
    .btn-main { background:#0f8; color:#000; }
    #users { padding:10px; display:flex; gap:10px; justify-content:center; min-height:30px; }
    .u-card { background:#111; padding:5px 12px; border-radius:15px; border:1px solid #333; font-size:12px; display:flex; align-items:center; gap:6px; }
    .u-dot { width:8px; height:8px; background:#444; border-radius:50%; transition:0.1s; }
    .u-dot.act { background:#0f8; box-shadow:0 0 8px #0f8; }
    #piano-wrap { flex:1; display:flex; justify-content:center; overflow-x:auto; background:#050505; align-items:flex-start; padding-top:20px; }
    #piano { display:flex; position:relative; }
    .k { position:relative; border:1px solid #222; border-radius:0 0 4px 4px; cursor:pointer; }
    .w { width:36px; height:200px; background:#fff; z-index:1; }
    .w.on { background:#ffe600 !important; }
    .b { width:22px; height:120px; background:#000; margin:0 -11px; z-index:2; border-color:#000; }
    .b.on { background:#ffe600 !important; }
  </style>
</head>
<body onclick="if(audio.state==='suspended')audio.resume()">

<header>
  <div class="logo">🎹 SESSION v1.3.7</div>
  <div id="login-form" class="control-group">
    <input id="rn" placeholder="ROOM">
    <input id="pw" type="password" placeholder="PASS" maxlength="4">
    <input id="nm" placeholder="NAME">
    <button class="btn-main" onclick="join()">JOIN</button>
  </div>
  <div id="connected-ui" style="display:none; gap:15px; align-items:center;">
    <span id="room-name" style="color:#0f8; font-weight:bold;"></span>
    <span id="ping" style="color:#666; font-size:12px;">--ms</span>
    <button style="background:#444; color:#fff;" onclick="location.reload()">EXIT</button>
  </div>
</header>

<div id="users"></div>
<div id="piano-wrap"><div id="piano"></div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const audio = new (window.AudioContext||window.webkitAudioContext)();
  const socket = io();
  const voices = {};
  let midiOuts = [];
  const peers = {};
  const echo = {};
  
  // [v1.3.7 핵심] 통합 페달 상태
  let isSustainOn = false;
  let sustainedNotes = new Set();

  const piano = document.getElementById('piano');
  for(let i=21; i<=108; i++) {
    const isB = [1,3,6,8,10].includes(i%12);
    const d = document.createElement('div');
    d.id = 'k'+i; d.className = `k ${isB?'b':'w'}`;
    d.onmousedown = (e) => { e.preventDefault(); tx(144, i, 100); };
    d.onmouseenter = (e) => { if(e.buttons === 1) tx(144, i, 100); };
    d.onmouseleave = () => tx(128, i, 0);
    d.onmouseup = () => tx(128, i, 0);
    piano.appendChild(d);
  }

  // [v1.3.7] 공용 처리 로직 (나와 남의 신호 모두 여기서 처리)
  function processSignal(s, n, v, isRemote = false) {
    const type = s & 0xf0;

    // 1. 페달 처리 (CC 64)
    if (type === 0xb0 && n === 64) {
      isSustainOn = v >= 64;
      if (!isSustainOn) {
        sustainedNotes.forEach(note => stopSound(note));
        sustainedNotes.clear();
      }
    } 
    // 2. Note On
    else if (type === 0x90 && v > 0) {
      playKey(n, v);
    } 
    // 3. Note Off
    else {
      document.getElementById('k'+n)?.classList.remove('on');
      if (isSustainOn) sustainedNotes.add(n); else stopSound(n);
    }
  }

  function playKey(n, v) {
    if(voices[n]) stopSound(n);
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = 'triangle';
    o.frequency.value = 440 * Math.pow(2, (n-69)/12);
    g.gain.setValueAtTime((v/127)*0.3, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + 1.5);
    o.connect(g); g.connect(audio.destination);
    o.start();
    voices[n] = { o, g };
    document.getElementById('k'+n)?.classList.add('on');
    sustainedNotes.delete(n);
  }

  function stopSound(n) {
    if(voices[n]) {
      const { o, g } = voices[n];
      g.gain.setTargetAtTime(0, audio.currentTime, 0.04);
      setTimeout(() => { try { o.stop(); o.disconnect(); } catch(e){} }, 200);
      delete voices[n];
    }
    document.getElementById('k'+n)?.classList.remove('on');
  }

  function tx(s, n, v) {
    if(audio.state==='suspended') audio.resume();
    processSignal(s, n, v, false); // 로컬 실행
    
    const msg = [s, n, v];
    const str = JSON.stringify(msg);
    for(const id in peers) if(peers[id].dc?.readyState === 'open') peers[id].dc.send(str);
    if(window.currentRoom) socket.emit('midi-msg', { roomName: window.currentRoom, msg });
  }

  function join() {
    const r = document.getElementById('rn').value, p = document.getElementById('pw').value, n = document.getElementById('nm').value;
    if(r&&p&&n) { socket.emit('join-room', { roomName: r, userName: n, password: p }); window.currentRoom = r; }
  }

  socket.on('join-success', d => {
    document.getElementById('login-form').style.display = 'none';
    document.getElementById('connected-ui').style.display = 'flex';
    document.getElementById('room-name').innerText = d.roomName;
    d.users.forEach(addU);
  });

  socket.on('remote-midi', d => {
    if(echo[`${d.msg[0]}-${d.msg[1]}`] && Date.now()-echo[`${d.msg[0]}-${d.msg[1]}`] < 100) return;
    processSignal(d.msg[0], d.msg[1], d.msg[2], true);
    const dot = document.getElementById('d-'+d.id);
    if(dot) { dot.classList.add('act'); setTimeout(()=>dot.classList.remove('act'), 100); }
    midiOuts.forEach(out => out.send(d.msg));
  });

  function addU(u) {
    if(document.getElementById('u-'+u.id)) return;
    const d = document.createElement('div');
    d.id = 'u-'+u.id; d.className = 'u-card';
    d.innerHTML = `<span class="u-dot" id="d-${u.id}"></span>${u.name}`;
    document.getElementById('users').appendChild(d);
  }

  // P2P 로직 유지
  socket.on('user-joined', u => { addU(u); setupPeer(u.id, true); });
  socket.on('user-left', id => document.getElementById('u-'+id)?.remove());

  function setupPeer(id, init) {
    const pc = new RTCPeerConnection({ iceServers:[{ urls:'stun:stun.l.google.com:19302' }] });
    peers[id] = { pc };
    pc.onicecandidate = e => e.candidate && socket.emit('webrtc-signal', { to:id, signal:{ candidate:e.candidate } });
    const dcH = (dc) => {
      peers[id].dc = dc;
      dc.onmessage = e => {
        const m = JSON.parse(e.data);
        processSignal(m[0], m[1], m[2], true);
      };
    };
    if(init) { const dc = pc.createDataChannel('m'); dcH(dc); pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => socket.emit('webrtc-signal', { to:id, signal:{ offer:pc.localDescription } })); }
    else pc.ondatachannel = e => dcH(e.channel);
  }

  socket.on('webrtc-signal', async d => {
    const pc = peers[d.from]?.pc || setupPeer(d.from, false).pc;
    if(d.signal.offer) { await pc.setRemoteDescription(d.signal.offer); const a = await pc.createAnswer(); await pc.setLocalDescription(a); socket.emit('webrtc-signal', { to:d.from, signal:{ answer:a } }); }
    else if(d.signal.answer) await pc.setRemoteDescription(d.signal.answer);
    else if(d.signal.candidate) await pc.addIceCandidate(d.signal.candidate);
  });

  socket.on('ping-res', t => document.getElementById('ping').innerText = (Date.now()-t) + 'ms');
  setInterval(() => window.currentRoom && socket.emit('ping-req', Date.now()), 2000);

  if(navigator.requestMIDIAccess) {
    navigator.requestMIDIAccess().then(m => {
      for(let i of m.inputs.values()) i.onmidimessage = e => tx(e.data[0], e.data[1], e.data[2]);
      for(let o of m.outputs.values()) midiOuts.push(o);
    });
  }
</script>
</body>
</html>
