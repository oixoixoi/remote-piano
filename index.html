<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Remote Piano v1.3.4</title>
  <style>
    body { background:#111; color:#fff; display:flex; flex-direction:column; height:100vh; margin:0; overflow:hidden; font-family:sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
    header { padding:15px 25px; display:flex; justify-content:space-between; align-items:center; background:#1a1a1a; border-bottom:1px solid #333; z-index:10; box-shadow:0 4px 10px rgba(0,0,0,0.5); }
    .logo { font-size:22px; font-weight:bold; color:#0f8; letter-spacing:1px; }
    .control-group { display:flex; gap:10px; align-items:center; }
    input { padding:10px 15px; background:#222; border:1px solid #444; color:#fff; border-radius:5px; font-size:14px; outline:none; transition:0.2s; }
    input:focus { border-color:#0f8; }
    button { padding:10px 20px; border:none; border-radius:5px; font-weight:bold; font-size:14px; cursor:pointer; transition:0.2s; }
    .btn-create { background:#0f8; color:#000; }
    .btn-join { background:#0ea5e9; color:#fff; }
    .btn-leave { background:#ff4444; color:#fff; }
    .status-wrap { display:flex; align-items:center; gap:15px; background:rgba(0,0,0,0.5); padding:8px 15px; border-radius:10px; border:1px solid #333; }
    .net-info { text-align:right; display:flex; flex-direction:column; gap:3px; }
    #net-mode { font-size:12px; font-weight:bold; color:#888; }
    #net-ping { font-size:14px; font-weight:bold; color:#888; font-family:monospace; }
    #users { padding:20px; display:flex; gap:20px; flex-wrap:wrap; justify-content:center; min-height:40px; }
    .u-card { background:#2a2a2a; padding:12px 25px; border-radius:30px; display:flex; align-items:center; gap:10px; border:1px solid #555; font-size:18px; font-weight:bold; box-shadow:0 4px 6px rgba(0,0,0,0.3); }
    .u-dot { width:12px; height:12px; background:#555; border-radius:50%; transition:0.1s; }
    .u-dot.act { background:#0f8; box-shadow:0 0 10px #0f8; transform:scale(1.3); }
    #piano { flex:1; display:flex; align-items:flex-start; padding-top:60px; justify-content:center; position:relative; overflow-x:auto; background:linear-gradient(to bottom, #111, #050505); }
    .k { position:relative; border-radius:0 0 5px 5px; cursor:pointer; transition:background 0.05s; -webkit-user-drag:none; }
    .w { width:38px; height:240px; background:#fff; border:1px solid #ccc; z-index:1; }
    .w.on { background:#ffe600 !important; box-shadow:0 0 15px rgba(255,230,0,0.5); }
    .b { width:24px; height:150px; background:#000; margin:0 -12px 90px -12px; z-index:2; border:1px solid #222; }
    .b.on { background:#ffe600 !important; box-shadow:0 0 15px rgba(255,230,0,0.5); }
  </style>
</head>
<body onclick="if(audio.state==='suspended')audio.resume()">

<header>
  <div class="logo">🎹 Remote Piano</div>
  <div class="control-group" id="login-form">
    <input id="rn" placeholder="방 이름" autocomplete="off">
    <input id="pw" type="password" placeholder="비번(4자리)" maxlength="4" autocomplete="off">
    <input id="nm" placeholder="닉네임" autocomplete="off">
    <button class="btn-create" onclick="createRoom()">방 만들기</button>
    <button class="btn-join" onclick="joinRoom()">방 접속</button>
  </div>
  <div class="control-group" id="connected-ui" style="display:none;">
    <div id="room-name-display" style="font-weight:bold; color:#0f8; font-size:16px; margin-right:15px; letter-spacing:1px;"></div>
    <div class="status-wrap" id="dash">
      <div class="net-info">
        <div id="net-mode">통신상태: 대기중</div>
        <div id="net-ping">-- ms</div>
      </div>
    </div>
    <button class="btn-leave" onclick="location.reload()">접속 끊기</button>
  </div>
</header>

<div id="users"></div>
<div id="piano"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const audio = new (window.AudioContext||window.webkitAudioContext)();
  const socket = io();
  const oscs = {}, gains = {};
  let midiOutputs = []; 
  const echoBlock = {}; 
  const peers = {}; 
  const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }; 

  let isSustainOn = false;
  let sustainedNotes = new Set();

  function play(n, v) {
    if(oscs[n]) stop(n);
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = 'triangle';
    o.frequency.value = 440 * Math.pow(2, (n-69)/12);
    const vol = (v/127) * 0.5;
    g.gain.setValueAtTime(0, audio.currentTime);
    g.gain.linearRampToValueAtTime(vol, audio.currentTime + 0.005);
    g.gain.exponentialRampToValueAtTime(vol * 0.1, audio.currentTime + 1.5);
    o.connect(g); g.connect(audio.destination);
    o.start();
    oscs[n]=o; gains[n]=g;
    const k = document.getElementById('k'+n);
    if(k) k.classList.add('on');
    sustainedNotes.delete(n);
  }

  function stop(n) {
    if(gains[n]) {
      gains[n].gain.cancelScheduledValues(audio.currentTime);
      gains[n].gain.setTargetAtTime(0, audio.currentTime, 0.03);
      const o = oscs[n];
      setTimeout(()=>{ if(o) { o.stop(); o.disconnect(); } }, 100);
    }
    delete oscs[n]; delete gains[n];
    const k = document.getElementById('k'+n);
    if(k) k.classList.remove('on');
  }

  function tx(s, n, v) {
    if(audio.state === 'suspended') audio.resume();
    const type = s & 0xf0;

    if (type === 0xb0 && n === 64) {
      isSustainOn = v >= 64;
      if (!isSustainOn) {
        sustainedNotes.forEach(note => stop(note));
        sustainedNotes.clear();
      }
    } else if (type === 0x90 && v > 0) {
      play(n, v);
    } else {
      const k = document.getElementById('k'+n);
      if(k) k.classList.remove('on');
      if (isSustainOn) sustainedNotes.add(n); else stop(n);
    }
    
    let sentP2P = false;
    const msgStr = JSON.stringify([s, n, v]);
    for (const peerId in peers) {
      const channel = peers[peerId].dataChannel;
      if (channel && channel.readyState === 'open') {
        channel.send(msgStr);
        sentP2P = true;
      }
    }
    if (!sentP2P && window.currentRoom) socket.emit('midi-msg', { roomName: window.currentRoom, msg: [s, n, v] });
  }

  const p = document.getElementById('piano');
  for(let i=21; i<=108; i++) {
    const isB = [1,3,6,8,10].includes(i%12);
    const d = document.createElement('div');
    d.id = 'k'+i; d.className = `k ${isB?'b':'w'}`;
    d.draggable = false; 
    d.addEventListener('mousedown', (e) => { e.preventDefault(); tx(144, i, 100); });
    d.addEventListener('mouseenter', (e) => { if(e.buttons === 1) tx(144, i, 100); });
    d.addEventListener('mouseleave', (e) => { tx(128, i, 0); });
    d.addEventListener('mouseup', (e) => { tx(128, i, 0); });
    d.addEventListener('touchstart', (e) => { e.preventDefault(); tx(144, i, 100); }, {passive: false});
    d.addEventListener('touchend', (e) => { e.preventDefault(); tx(128, i, 0); }, {passive: false});
    p.appendChild(d);
  }

  // 글리산도 터치 보정
  let lastTouchNode = null;
  document.addEventListener('touchmove', (e) => {
    const touch = e.touches[0];
    const elem = document.elementFromPoint(touch.clientX, touch.clientY);
    if(elem && elem.classList.contains('k')) {
      const note = parseInt(elem.id.replace('k',''));
      if(lastTouchNode !== note) {
        if(lastTouchNode) tx(128, lastTouchNode, 0);
        lastTouchNode = note;
        tx(144, note, 100);
      }
    }
  }, {passive: false});

  function createRoom() {
    const r = document.getElementById('rn').value, pw = document.getElementById('pw').value, n = document.getElementById('nm').value;
    if(!r || !pw || !n) return alert("빈칸을 채워주세요.");
    socket.emit('create-room', { roomName: r, userName: n, password: pw });
    window.currentRoom = r;
  }

  function joinRoom() {
    const r = document.getElementById('rn').value, pw = document.getElementById('pw').value, n = document.getElementById('nm').value;
    if(!r || !pw || !n) return alert("빈칸을 채워주세요.");
    socket.emit('join-room', { roomName: r, userName: n, password: pw });
    window.currentRoom = r;
  }

  socket.on('join-success', d => {
    document.getElementById('login-form').style.display = 'none';
    document.getElementById('connected-ui').style.display = 'flex';
    document.getElementById('room-name-display').innerText = `[ ${d.roomName} ]`;
    upd(d.users);
  });

  socket.on('error-msg', m => alert(m));
  socket.on('user-left', id => { document.getElementById('u-'+id)?.remove(); if(peers[id]) { peers[id].pc.close(); delete peers[id]; } });

  socket.on('remote-midi', d => { 
    const [s, n, v] = d.msg; 
    echoBlock[`${s}-${n}`] = Date.now(); 
    remoteProcess(s, n, v, d.id);
  });

  function remoteProcess(s, n, v, id) {
    const type = s & 0xf0;
    if (type === 0xb0 && n === 64) {
      isSustainOn = v >= 64;
      if (!isSustainOn) { sustainedNotes.forEach(note => stop(note)); sustainedNotes.clear(); }
    } else if (type === 0x90 && v > 0) {
      play(n, v);
    } else {
      const k = document.getElementById('k'+n);
      if(k) k.classList.remove('on');
      if (isSustainOn) sustainedNotes.add(n); else stop(n);
    }
    flash(id);
    midiOutputs.forEach(out => out.send([s, n, v]));
  }

  function setupPeer(peerId, initiate) {
    const pc = new RTCPeerConnection(rtcConfig);
    peers[peerId] = { pc: pc, dataChannel: null };
    pc.onicecandidate = e => { if (e.candidate) socket.emit('webrtc-signal', { to: peerId, signal: { candidate: e.candidate } }); };
    const dcHandler = (dc) => {
      peers[peerId].dataChannel = dc;
      dc.onmessage = e => {
        const data = JSON.parse(e.data);
        if(data[0] === 'ping') return dc.send(JSON.stringify(['pong', data[1]]));
        if(data[0] === 'pong') return updatePing(Date.now() - data[1]);
        remoteProcess(data[0], data[1], data[2], peerId);
      };
      dc.onopen = () => document.getElementById('net-mode').innerText = "통신상태: P2P연결됨 🟢";
    };
    if (initiate) { const dc = pc.createDataChannel('midi'); dcHandler(dc); pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => socket.emit('webrtc-signal', { to: peerId, signal: { offer: pc.localDescription } })); }
    else { pc.ondatachannel = e => dcHandler(e.channel); }
  }

  socket.on('user-joined', u => { addU(u); setupPeer(u.id, true); });
  socket.on('webrtc-signal', async d => {
    const { from, signal } = d;
    if (!peers[from]) setupPeer(from, false);
    const pc = peers[from].pc;
    if (signal.offer) { await pc.setRemoteDescription(new RTCSessionDescription(signal.offer)); const a = await pc.createAnswer(); await pc.setLocalDescription(a); socket.emit('webrtc-signal', { to: from, signal: { answer: pc.localDescription } }); }
    else if (signal.answer) { await pc.setRemoteDescription(new RTCSessionDescription(signal.answer)); }
    else if (signal.candidate) { await pc.addIceCandidate(new RTCIceCandidate(signal.candidate)); }
  });

  function updatePing(ms) { document.getElementById('net-ping').innerText = ms + " ms"; }
  socket.on('ping-res', t => updatePing(Date.now() - t));
  setInterval(() => { if(window.currentRoom) socket.emit('ping-req', Date.now()); }, 2000);

  function upd(us) { document.getElementById('users').innerHTML=''; us.forEach(addU); }
  function addU(u) { if(!document.getElementById('u-'+u.id)) { const d = document.createElement('div'); d.className = 'u-card'; d.id='u-'+u.id; d.innerHTML=`<span class="u-dot" id="d-${u.id}"></span>${u.name}`; document.getElementById('users').appendChild(d); } }
  function flash(id) { const d = document.getElementById('d-'+id); if(d) { d.classList.add('act'); setTimeout(()=>d.classList.remove('act'), 100); } }

  if(navigator.requestMIDIAccess) {
    navigator.requestMIDIAccess().then(m => { 
      for(let i of m.inputs.values()) i.onmidimessage = e => {
        if (echoBlock[`${e.data[0]}-${e.data[1]}`] && Date.now() - echoBlock[`${e.data[0]}-${e.data[1]}`] < 100) return;
        tx(e.data[0], e.data[1], e.data[2]);
      };
      for(let o of m.outputs.values()) midiOutputs.push(o);
    });
  }
</script>
</body>
</html>
