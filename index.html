<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Remote Piano v1.1.4</title>
  <style>
    body { background:#0a0a0a; color:#fff; margin:0; font-family:sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
    header { padding:0 25px; height:70px; display:flex; justify-content:space-between; align-items:center; background:#1a1a1a; border-bottom:1px solid #333; position:relative; }
    .logo { font-size:20px; font-weight:900; color:#0f8; display:flex; align-items:center; gap:8px; }
    .version-tag { font-size:10px; background:#333; color:#aaa; padding:2px 6px; border-radius:10px; }
    #room-display-center { position:absolute; left:50%; transform:translateX(-50%); text-align:center; pointer-events:none; }
    #room-name-big { font-size:24px; font-weight:bold; color:#0f8; text-transform:uppercase; letter-spacing:1px; }
    #ping-small { font-size:11px; color:#666; font-family:monospace; }
    .controls { display:flex; align-items:center; gap:12px; }
    .sound-toggle { padding:8px 14px; border-radius:4px; border:1px solid #444; background:#222; color:#eee; cursor:pointer; font-size:12px; font-weight:bold; }
    .sound-toggle.off { background:#442222; color:#ff8888; }
    .sound-toggle.on { background:#224422; color:#88ff88; }
    .auth { display:flex; gap:8px; }
    input { padding:8px; background:#222; border:1px solid #444; color:#fff; border-radius:4px; width:90px; outline:none; }
    .btn-join { padding:8px 15px; border:none; border-radius:4px; font-weight:bold; cursor:pointer; background:#0f8; color:#000; }
    #users { padding:15px; display:flex; gap:10px; justify-content:center; min-height:45px; flex-wrap:wrap; }
    .u-card { background:#222; padding:6px 14px; border-radius:20px; border:1px solid #333; display:flex; align-items:center; gap:8px; font-size:13px; }
    .u-dot { width:10px; height:10px; background:#444; border-radius:50%; transition: 0.1s; }
    .u-dot.act { background:#0f8 !important; box-shadow:0 0 10px #0f8; }
    #piano-wrap { flex:1; display:flex; justify-content:center; align-items:flex-start; padding-top:40px; background:#050505; overflow-x:auto; user-select:none; }
    .k { position:relative; cursor:pointer; border-radius:0 0 5px 5px; }
    .w { width:38px; height:220px; background:linear-gradient(to bottom, #eee, #fff 95%, #bbb); border:1px solid #888; z-index:1; margin-right:-1px; }
    .w.on { background:linear-gradient(to bottom, #ffcc00, #ffaa00) !important; transform:translateY(2px); }
    .b { width:24px; height:130px; background:linear-gradient(to bottom, #444, #000); margin:0 -12px 90px -12px; z-index:2; border:1px solid #000; }
    .b.on { background:linear-gradient(to bottom, #ccaa00, #997700) !important; transform:translateY(2px); }
  </style>
</head>
<body>

<header>
  <div class="logo">🎹 SESSION <span class="version-tag">v1.1.4</span></div>
  <div id="room-display-center" style="display:none;"><div id="room-name-big"></div><div id="ping-small">--ms</div></div>
  <div class="controls">
    <button id="sound-btn" class="sound-toggle on" onclick="toggleSound()">SOUND ON</button>
    <div class="auth" id="login-form">
      <input id="rn" placeholder="ROOM">
      <input id="pw" type="text" maxlength="6" placeholder="PASS(6)" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
      <input id="nm" placeholder="NAME">
      <button class="btn-join" onclick="join()">JOIN</button>
    </div>
    <button id="exit-btn" style="display:none; background:#ff4444; color:#fff; border:none; padding:8px 14px; border-radius:4px; font-weight:bold; cursor:pointer;" onclick="location.reload()">EXIT</button>
  </div>
</header>

<div id="room-list-container" style="padding:10px 25px; background:#111; display:flex; gap:10px; overflow-x:auto; border-bottom:1px solid #222; min-height:20px;"></div>
<div id="users"></div>
<div id="piano-wrap"><div id="piano" style="display:flex;"></div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const audio = new (window.AudioContext||window.webkitAudioContext)();
  const voices = {};
  let midiOuts = [];
  let currentRoomName = "";
  let isLocalSoundEnabled = true;
  let isSustainOn = false;
  let sustainedNotes = new Set();
  let lastRoomListData = "";

  function toggleSound() {
    isLocalSoundEnabled = !isLocalSoundEnabled;
    const btn = document.getElementById('sound-btn');
    btn.innerText = isLocalSoundEnabled ? "SOUND ON" : "SOUND OFF";
    btn.className = isLocalSoundEnabled ? "sound-toggle on" : "sound-toggle off";
    if(isLocalSoundEnabled) audio.resume();
  }

  const p = document.getElementById('piano');
  for(let i=21; i<=108; i++) {
    const isB = [1,3,6,8,10].includes(i%12);
    const d = document.createElement('div');
    d.id = 'k'+i; d.className = `k ${isB?'b':'w'}`;
    d.onmousedown = () => tx(144, i, 100);
    d.onmouseup = () => tx(128, i, 0);
    p.appendChild(d);
  }

  socket.on('room-list', list => {
    const container = document.getElementById('room-list-container');
    if (currentRoomName) { container.style.display = 'none'; return; }
    const currentData = JSON.stringify(list);
    if (lastRoomListData === currentData) return;
    lastRoomListData = currentData;
    container.innerHTML = list.length ? '<span style="font-size:12px; color:#666; align-self:center;">OPEN ROOMS:</span>' : '';
    list.forEach(room => {
      const item = document.createElement('div');
      item.style.cssText = "background:#222; padding:5px 12px; border-radius:15px; font-size:12px; cursor:pointer; border:1px solid #333;";
      item.innerText = `${room.name} (${room.userCount})`;
      item.onclick = () => { document.getElementById('rn').value = room.name; document.getElementById('pw').focus(); };
      container.appendChild(item);
    });
  });

  function join() {
    audio.resume();
    const r = document.getElementById('rn').value, p = document.getElementById('pw').value, n = document.getElementById('nm').value;
    if(!r || p.length !== 6 || !n) return alert("CHECK ROOM, PASS(6), NAME!");
    currentRoomName = r;
    socket.emit('join-room', { roomName: r, userName: n, password: p });
  }

  // [v1.1.4 핵심] 신호 처리 필터 강화
  function tx(s, n, v) {
    const type = s & 0xf0; // 채널 정보 제외한 순수 메시지 타입
    if (type === 0xb0 && n === 64) { // CC 64 (페달)
      isSustainOn = v >= 64;
      if (!isSustainOn) { sustainedNotes.forEach(note => stopSound(note)); sustainedNotes.clear(); }
    } else if (type === 0x90 && v > 0) { // Note On
      playKey(n, v, socket.id, true);
    } else if (type === 0x80 || (type === 0x90 && v === 0)) { // Note Off
      stopKey(n);
    }
    if(currentRoomName) socket.emit('midi-msg', { roomName: currentRoomName, msg: [s, n, v] });
  }

  function playKey(n, v, id, isMe) {
    document.getElementById('k'+n)?.classList.add('on');
    const dot = document.getElementById('d-' + id);
    if(dot) { dot.classList.add('act'); setTimeout(() => dot.classList.remove('act'), 150); }
    if(isMe && !isLocalSoundEnabled) return;
    if(voices[n]) stopSound(n);
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = 'triangle';
    o.frequency.value = 440 * Math.pow(2, (n-69)/12);
    g.gain.setValueAtTime((v/127)*0.2, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 2.5);
    o.connect(g); g.connect(audio.destination);
    o.start();
    voices[n] = { o, g };
  }

  function stopKey(n) {
    document.getElementById('k'+n)?.classList.remove('on');
    if (isSustainOn) sustainedNotes.add(n); else stopSound(n);
  }

  function stopSound(n) {
    if(voices[n]) {
      const { o, g } = voices[n];
      g.gain.setTargetAtTime(0, audio.currentTime, 0.03);
      setTimeout(() => { try { o.stop(); o.disconnect(); } catch(e){} }, 100);
      delete voices[n];
    }
  }

  socket.on('join-success', d => {
    document.getElementById('login-form').style.display = 'none';
    document.getElementById('room-list-container').style.display = 'none';
    document.getElementById('exit-btn').style.display = 'block';
    document.getElementById('room-display-center').style.display = 'block';
    document.getElementById('room-name-big').innerText = d.roomName;
    upd(d.users);
  });

  socket.on('update-users', us => upd(us));

  // [v1.1.4 핵심] 원격 신호 수신부 필터 강화
  socket.on('remote-midi', d => {
    const [s, n, v] = d.msg;
    const type = s & 0xf0;
    if (type === 0xb0 && n === 64) {
      isSustainOn = v >= 64;
      if (!isSustainOn) { sustainedNotes.forEach(note => stopSound(note)); sustainedNotes.clear(); }
    } else if (type === 0x90 && v > 0) {
      playKey(n, v, d.id, false);
    } else if (type === 0x80 || (type === 0x90 && v === 0)) {
      stopKey(n);
    }
    midiOuts.forEach(out => out.send([s, n, v]));
  });

  socket.on('ping-res', t => { document.getElementById('ping-small').innerText = (Date.now()-t)+"ms"; });
  setInterval(() => { if(currentRoomName) socket.emit('ping-req', Date.now()); }, 2000);

  function upd(us) {
    const c = document.getElementById('users');
    const currentUsersData = JSON.stringify(us);
    if (c.getAttribute('data-last') === currentUsersData) return;
    c.setAttribute('data-last', currentUsersData);
    c.innerHTML = '';
    us.forEach(u => {
      const d = document.createElement('div'); d.className = 'u-card';
      d.innerHTML = `<span class="u-dot" id="d-${u.id}"></span>${u.name}`;
      c.appendChild(d);
    });
  }

  if(navigator.requestMIDIAccess) {
    navigator.requestMIDIAccess({ sysex: true }).then(access => {
      for (let input of access.inputs.values()) {
        input.onmidimessage = (e) => tx(e.data[0], e.data[1], e.data[2]);
      }
      for (let output of access.outputs.values()) {
        if(output.name.includes("IAC") || output.name.includes("Bus")) midiOuts.push(output);
      }
    });
  }
</script>
</body>
</html>
