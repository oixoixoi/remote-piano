<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Remote Piano Session</title>
  <style>
    body { background:#111; color:#fff; display:flex; flex-direction:column; height:100vh; margin:0; font-family:sans-serif; overflow:hidden; }
    header { padding:15px 25px; display:flex; justify-content:space-between; align-items:center; background:#1a1a1a; border-bottom:1px solid #333; }
    .logo { font-size:22px; font-weight:bold; color:#0f8; }
    .control-group { display:flex; gap:10px; }
    input { padding:10px; background:#222; border:1px solid #444; color:#fff; border-radius:5px; width:110px; }
    button { padding:10px 20px; border:none; border-radius:5px; font-weight:bold; cursor:pointer; background:#0f8; color:#000; }
    #users { padding:20px; display:flex; gap:15px; justify-content:center; min-height:50px; }
    .u-card { background:#2a2a2a; padding:10px 20px; border-radius:20px; border:1px solid #444; display:flex; align-items:center; gap:8px; }
    .u-dot { width:10px; height:10px; background:#555; border-radius:50%; }
    .u-dot.act { background:#0f8; box-shadow:0 0 8px #0f8; }
    #piano { flex:1; display:flex; justify-content:center; align-items:flex-start; padding-top:50px; background:#050505; overflow-x:auto; }
    .k { position:relative; cursor:pointer; border-radius:0 0 4px 4px; }
    .w { width:35px; height:220px; background:#fff; border:1px solid #ccc; z-index:1; margin-right:-1px; }
    .w.on { background:#ffe600; }
    .b { width:22px; height:130px; background:#000; margin:0 -11px 90px -11px; z-index:2; border:1px solid #222; }
    .b.on { background:#ffe600 !important; }
  </style>
</head>
<body>

<header>
  <div class="logo">🎹 Remote Piano</div>
  <div class="control-group" id="login-form">
    <input id="rn" placeholder="방 이름">
    <input id="pw" type="password" placeholder="비번">
    <input id="nm" placeholder="닉네임">
    <button onclick="join()">접속</button>
  </div>
  <div class="control-group" id="connected-ui" style="display:none;">
    <div id="status" style="font-size:12px; color:#888; text-align:right;">대기 중...<br><span id="ping">-- ms</span></div>
    <button style="background:#ff4444; color:#fff;" onclick="location.reload()">나가기</button>
  </div>
</header>

<div id="users"></div>
<div id="piano"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const audio = new (window.AudioContext||window.webkitAudioContext)();
  const socket = io();
  const oscs = {}, gains = {};
  let midiOutputs = [];

  // 오디오 엔진 활성화
  function unlock() { if(audio.state === 'suspended') audio.resume(); }

  function play(n, v) {
    unlock();
    if(oscs[n]) stop(n);
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = 'triangle';
    o.frequency.value = 440 * Math.pow(2, (n-69)/12);
    g.gain.setValueAtTime((v/127)*0.3, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + 1.5);
    o.connect(g); g.connect(audio.destination);
    o.start();
    oscs[n]=o; gains[n]=g;
    document.getElementById('k'+n)?.classList.add('on');
  }

  function stop(n) {
    if(gains[n]) {
      gains[n].gain.linearRampToValueAtTime(0, audio.currentTime + 0.1);
      setTimeout(() => { if(oscs[n]) oscs[n].stop(); }, 150);
    }
    document.getElementById('k'+n)?.classList.remove('on');
    delete oscs[n]; delete gains[n];
  }

  function tx(s, n, v) {
    if(s === 144 && v > 0) play(n, v); else stop(n);
    if(window.currentRoom) socket.emit('midi-msg', { roomName: window.currentRoom, msg: [s, n, v] });
  }

  // 건반 생성
  const p = document.getElementById('piano');
  for(let i=21; i<=108; i++) {
    const isB = [1,3,6,8,10].includes(i%12);
    const d = document.createElement('div');
    d.id = 'k'+i; d.className = `k ${isB?'b':'w'}`;
    d.onmousedown = () => tx(144, i, 100);
    d.onmouseup = () => tx(128, i, 0);
    p.appendChild(d);
  }

  // 접속 함수 (이름: join)
  function join() {
    unlock();
    const r = document.getElementById('rn').value;
    const pw = document.getElementById('pw').value;
    const n = document.getElementById('nm').value;
    if(!r || !pw || !n) return alert("빈칸을 입력하세요!");
    
    window.currentRoom = r;
    socket.emit('join-room', { roomName: r, userName: n, password: pw });
  }

  socket.on('join-success', d => {
    document.getElementById('login-form').style.display = 'none';
    document.getElementById('connected-ui').style.display = 'flex';
    upd(d.users);
  });

  socket.on('error-msg', m => alert(m));
  socket.on('update-users', us => upd(us));

  socket.on('remote-midi', d => {
    const [s, n, v] = d.msg;
    if(s === 144 && v > 0) play(n, v); else stop(n);
    const dot = document.getElementById('d-'+d.id);
    if(dot) { dot.classList.add('act'); setTimeout(()=>dot.classList.remove('act'), 100); }
    // 로직으로 미디 출력
    midiOutputs.forEach(out => out.send([s, n, v]));
  });

  function upd(us) {
    const c = document.getElementById('users'); c.innerHTML = '';
    us.forEach(u => {
      const d = document.createElement('div'); d.className = 'u-card';
      d.innerHTML = `<span class="u-dot" id="d-${u.id}"></span>${u.name}`;
      c.appendChild(d);
    });
  }

  socket.on('ping-res', t => { document.getElementById('ping').innerText = (Date.now()-t) + " ms"; });
  setInterval(() => { if(window.currentRoom) socket.emit('ping-req', Date.now()); }, 2000);

  if(navigator.requestMIDIAccess) {
    navigator.requestMIDIAccess().then(m => {
      for(let i of m.inputs.values()) i.onmidimessage = e => tx(e.data[0], e.data[1], e.data[2]);
      for(let o of m.outputs.values()) midiOutputs.push(o);
    });
  }
</script>
</body>
</html>
