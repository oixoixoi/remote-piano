<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Piano Session v1.4.0</title>
  <style>
    body { background:#111; color:#eee; margin:0; font-family:sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
    header { padding:15px 25px; display:flex; justify-content:space-between; align-items:center; background:#1a1a1a; border-bottom:1px solid #333; }
    .logo { color:#0f8; font-weight:bold; font-size:20px; }
    input { padding:8px; background:#222; border:1px solid #444; color:#fff; border-radius:4px; width:90px; }
    button { padding:8px 15px; border:none; border-radius:4px; cursor:pointer; font-weight:bold; background:#0f8; }
    #users { padding:10px; display:flex; gap:10px; justify-content:center; }
    .u-card { background:#222; padding:5px 12px; border-radius:15px; border:1px solid #333; font-size:12px; display:flex; align-items:center; gap:6px; }
    .u-dot { width:8px; height:8px; background:#444; border-radius:50%; transition:0.1s; }
    .u-dot.act { background:#0f8; box-shadow:0 0 8px #0f8; }
    #piano-wrap { flex:1; display:flex; justify-content:center; overflow-x:auto; background:#050505; align-items:flex-start; padding-top:30px; }
    #piano { display:flex; position:relative; }
    .k { position:relative; border:1px solid #222; border-radius:0 0 4px 4px; cursor:pointer; }
    .w { width:36px; height:220px; background:#fff; z-index:1; margin-right:-1px; }
    .w.on { background:#ffe600 !important; }
    .b { width:22px; height:130px; background:#000; margin:0 -11px; z-index:2; border-color:#000; }
    .b.on { background:#ffe600 !important; }
  </style>
</head>
<body onclick="if(audio.state==='suspended')audio.resume()">

<header>
  <div class="logo">🎹 SESSION v1.4.0</div>
  <div id="login-form">
    <input id="rn" placeholder="ROOM">
    <input id="pw" type="password" placeholder="PASS" maxlength="4">
    <input id="nm" placeholder="NAME">
    <button onclick="join()">JOIN</button>
  </div>
  <div id="connected-ui" style="display:none; gap:15px;">
    <span id="room-name" style="color:#0f8; font-weight:bold;"></span>
    <button style="background:#444; color:#fff;" onclick="location.reload()">EXIT</button>
  </div>
</header>

<div id="users"></div>
<div id="piano-wrap"><div id="piano"></div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const audio = new (window.AudioContext||window.webkitAudioContext)();
  const socket = io();
  const voices = {};
  let midiOuts = [];
  const peers = {};
  const echo = {}; // 피드백 루프 방지

  let isSustain = false;
  let sustainList = new Set();

  // 1. 건반 생성
  const piano = document.getElementById('piano');
  for(let i=21; i<=108; i++) {
    const isB = [1,3,6,8,10].includes(i%12);
    const d = document.createElement('div');
    d.id = 'k'+i; d.className = `k ${isB?'b':'w'}`;
    d.onmousedown = (e) => { e.preventDefault(); tx(144, i, 100); };
    d.onmouseenter = (e) => { if(e.buttons === 1) tx(144, i, 100); };
    d.onmouseleave = () => tx(128, i, 0); // 글리산도 잔상 방지
    d.onmouseup = () => tx(128, i, 0);
    piano.appendChild(d);
  }

  // 2. 통합 연주 로직 (이거 하나로 소리 다 통제)
  function process(s, n, v, id) {
    const type = s & 0xf0;
    
    // 페달
    if (type === 0xb0 && n === 64) {
      isSustain = v >= 64;
      if (!isSustain) { sustainList.forEach(stop); sustainList.clear(); }
    } 
    // 건반 누름
    else if (type === 0x90 && v > 0) {
      play(n, v);
    } 
    // 건반 뗌
    else {
      document.getElementById('k'+n)?.classList.remove('on'); // 불빛은 즉시 끔
      if (isSustain) sustainList.add(n); else stop(n);
    }
    if(id) flash(id);
  }

  function play(n, v) {
    if(voices[n]) stop(n);
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = 'triangle';
    o.frequency.value = 440 * Math.pow(2, (n-69)/12);
    g.gain.setValueAtTime((v/127)*0.3, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + 1.5);
    o.connect(g); g.connect(audio.destination);
    o.start();
    voices[n] = { o, g };
    document.getElementById('k'+n)?.classList.add('on');
  }

  function stop(n) {
    if(voices[n]) {
      const { o, g } = voices[n];
      g.gain.setTargetAtTime(0, audio.currentTime, 0.04); // 틱 소리 방지
      setTimeout(() => { try { o.stop(); o.disconnect(); } catch(e){} }, 150);
      delete voices[n];
    }
    document.getElementById('k'+n)?.classList.remove('on');
  }

  // 3. 전송부
  function tx(s, n, v) {
    if(audio.state==='suspended') audio.resume();
    process(s, n, v);
    const msg = [s, n, v];
    const str = JSON.stringify(msg);
    for(const id in peers) if(peers[id].dc?.readyState === 'open') peers[id].dc.send(str);
    if(window.currentRoom) socket.emit('midi-msg', { roomName: window.currentRoom, msg });
  }

  function join() {
    const r = document.getElementById('rn').value, p = document.getElementById('pw').value, n = document.getElementById('nm').value;
    if(r&&p&&n) { socket.emit('join-room', { roomName: r, userName: n, password: p }); window.currentRoom = r; }
  }

  socket.on('join-success', d => {
    document.getElementById('login-form').style.display = 'none';
    document.getElementById('connected-ui').style.display = 'flex';
    document.getElementById('room-name').innerText = d.roomName;
    d.users.forEach(addU);
  });

  socket.on('remote-midi', d => {
    if(echo[`${d.msg[0]}-${d.msg[1]}`] && Date.now()-echo[`${d.msg[0]}-${d.msg[1]}`] < 100) return;
    process(d.msg[0], d.msg[1], d.msg[2], d.id);
    midiOuts.forEach(out => out.send(d.msg));
  });

  function addU(u) {
    if(document.getElementById('u-'+u.id)) return;
    const d = document.createElement('div');
    d.id = 'u-'+u.id; d.className = 'u-card';
    d.innerHTML = `<span class="u-dot" id="d-${u.id}"></span>${u.name}`;
    document.getElementById('users').appendChild(d);
  }

  socket.on('user-joined', u => { addU(u); setupPeer(u.id, true); });
  socket.on('user-left', id => document.getElementById('u-'+id)?.remove());

  function setupPeer(id, init) {
    const pc = new RTCPeerConnection({ iceServers:[{ urls:'stun:stun.l.google.com:19302' }] });
    peers[id] = { pc };
    pc.onicecandidate = e => e.candidate && socket.emit('webrtc-signal', { to:id, signal:{ candidate:e.candidate } });
    const dcH = (dc) => {
      peers[id].dc = dc;
      dc.onmessage = e => {
        const m = JSON.parse(e.data);
        echo[`${m[0]}-${m[1]}`] = Date.now();
        process(m[0], m[1], m[2], id);
        midiOuts.forEach(out => out.send(m));
      };
    };
    if(init) { const dc = pc.createDataChannel('m'); dcH(dc); pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => socket.emit('webrtc-signal', { to:id, signal:{ offer:pc.localDescription } })); }
    else pc.ondatachannel = e => dcH(e.channel);
  }

  socket.on('webrtc-signal', async d => {
    const pc = peers[d.from]?.pc || setupPeer(d.from, false).pc;
    if(d.signal.offer) { await pc.setRemoteDescription(d.signal.offer); const a = await pc.createAnswer(); await pc.setLocalDescription(a); socket.emit('webrtc-signal', { to:d.from, signal:{ answer:a } }); }
    else if(d.signal.answer) await pc.setRemoteDescription(d.signal.answer);
    else if(d.signal.candidate) await pc.addIceCandidate(d.signal.candidate);
  });

  function flash(id) { const d = document.getElementById('d-'+id); if(d) { d.classList.add('act'); setTimeout(()=>d.classList.remove('act'), 100); } }

  if(navigator.requestMIDIAccess) {
    navigator.requestMIDIAccess().then(m => {
      for(let i of m.inputs.values()) i.onmidimessage = e => {
        if (echo[`${e.data[0]}-${e.data[1]}`] && Date.now() - echo[`${e.data[0]}-${e.data[1]}`] < 100) return;
        tx(e.data[0], e.data[1], e.data[2]);
      };
      for(let o of m.outputs.values()) midiOuts.push(o);
    });
  }
</script>
</body>
</html>
