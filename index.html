<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Remote Piano (Ultra-Low Latency)</title>
  <style>
    body { background:#111; color:#fff; display:flex; flex-direction:column; height:100vh; margin:0; overflow:hidden; font-family:sans-serif; touch-action:none; }
    #login { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); display:flex; justify-content:center; align-items:center; z-index:99; flex-direction:column; }
    .box { background:#222; padding:40px; border-radius:15px; text-align:center; border:1px solid #333; }
    h2 { margin-top:0; color:#0f8; }
    input { display:block; margin:15px 0; padding:15px; width:250px; background:#333; border:1px solid #555; color:#fff; border-radius:5px; font-size:16px; outline:none; box-sizing:border-box; }
    input:focus { border-color:#0f8; }
    button { padding:15px 30px; background:#0f8; border:none; cursor:pointer; font-weight:bold; font-size:16px; border-radius:5px; margin-top:10px; width:100%; transition:0.2s; }
    button:hover { background:#0c6; }
    header { padding:20px; display:flex; justify-content:space-between; align-items:center; background:#1a1a1a; border-bottom:1px solid #333; }
    .status-wrap { display:flex; align-items:center; gap:10px; }
    .status { width:12px; height:12px; border-radius:50%; background:#555; }
    .status.con { background:#f00; animation:blink 0.5s infinite; }
    .status.ok { background:#0f8; box-shadow:0 0 10px #0f8; animation:none; }
    @keyframes blink { 50% { opacity:0.3; } }
    #users { padding:15px; display:flex; gap:15px; flex-wrap:wrap; }
    .u-card { background:#2a2a2a; padding:8px 15px; border-radius:20px; display:flex; align-items:center; gap:8px; border:1px solid #444; font-size:14px; }
    .u-dot { width:8px; height:8px; background:#555; border-radius:50%; transition:0.1s; }
    .u-dot.act { background:#0f8; box-shadow:0 0 8px #0f8; transform:scale(1.2); }
    #piano { flex:1; display:flex; align-items:flex-end; padding-bottom:30px; justify-content:center; position:relative; overflow-x:auto; background:linear-gradient(to bottom, #111, #000); }
    .k { position:relative; border-radius:0 0 5px 5px; cursor:pointer; transition:background 0.05s; }
    .w { width:32px; height:220px; background:#fff; border:1px solid #ccc; z-index:1; }
    .w:active, .w.on { background:#ffe600; box-shadow:0 0 15px rgba(255,230,0,0.5); }
    .b { width:20px; height:140px; background:#000; margin:0 -10px 80px -10px; z-index:2; border:1px solid #222; }
    .b:active, .b.on { background:#d4a000; }
  </style>
</head>
<body>

<div id="login">
  <div class="box">
    <h2>🎹 P2P Jam (Low Latency)</h2>
    <input id="rn" placeholder="방 번호" autocomplete="off">
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="off">
    <input id="nm" placeholder="닉네임" autocomplete="off">
    <button onclick="join()">초고속 접속</button>
    <div id="err" style="color:#ff4444; margin-top:15px; font-size:14px;"></div>
  </div>
</div>

<header>
  <div id="info" style="font-weight:bold; color:#ccc;">연결 안됨</div>
  <div class="status-wrap">
    <span id="st-txt" style="font-size:12px; color:#888;">OFFLINE</span>
    <div id="st" class="status"></div>
  </div>
</header>

<div id="users"></div>
<div id="piano"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const audio = new (window.AudioContext||window.webkitAudioContext)();
  const socket = io();
  const oscs = {}, gains = {};
  let midiOutputs = []; 
  const echoBlock = {}; 

  // WebRTC P2P 연결 저장소
  const peers = {}; 
  const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }; // 구글 무료 서버 사용

  function play(n, v) {
    if(oscs[n]) stop(n);
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = 'triangle';
    o.frequency.value = 440 * Math.pow(2, (n-69)/12);
    const vol = (v/127) * 0.5;
    g.gain.setValueAtTime(0, audio.currentTime);
    g.gain.linearRampToValueAtTime(vol, audio.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 2.0);
    o.connect(g); g.connect(audio.destination);
    o.start();
    oscs[n]=o; gains[n]=g;
    const k = document.getElementById('k'+n);
    if(k) k.classList.add('on');
  }

  function stop(n) {
    if(gains[n]) gains[n].gain.linearRampToValueAtTime(0, audio.currentTime+0.1);
    setTimeout(()=>{ if(oscs[n]) { oscs[n].stop(); oscs[n].disconnect(); } delete oscs[n]; delete gains[n]; }, 150);
    const k = document.getElementById('k'+n);
    if(k) k.classList.remove('on');
  }

  // 데이터 전송: 서버를 거치지 않고 P2P 데이터 채널로 직접 쏨!
  function tx(s, n, v) {
    if(audio.state === 'suspended') audio.resume();
    if(s===144 && v>0) play(n,v); else stop(n);
    
    const msgStr = JSON.stringify([s, n, v]);
    for (const peerId in peers) {
      const channel = peers[peerId].dataChannel;
      if (channel && channel.readyState === 'open') {
        channel.send(msgStr);
      }
    }
  }

  const p = document.getElementById('piano');
  for(let i=21; i<=108; i++) {
    const isB = [1,3,6,8,10].includes(i%12);
    const d = document.createElement('div');
    d.id = 'k'+i; d.className = `k ${isB?'b':'w'}`;
    const press = (e) => { e.preventDefault(); tx(144, i, 100); };
    const release = (e) => { e.preventDefault(); tx(128, i, 0); };
    d.addEventListener('mousedown', press);
    d.addEventListener('touchstart', press, {passive: false});
    d.addEventListener('mouseup', release);
    d.addEventListener('mouseleave', release);
    d.addEventListener('touchend', release);
    d.addEventListener('touchcancel', release);
    p.appendChild(d);
  }

  function join() {
    const r = document.getElementById('rn').value, p = document.getElementById('pw').value, n = document.getElementById('nm').value;
    if(!r || !p || !n) return document.getElementById('err').innerText = "빈칸을 채워주세요!";
    if(audio.state==='suspended') audio.resume();
    document.getElementById('st').className = 'status con';
    document.getElementById('st-txt').innerText = "CONNECTING P2P...";
    socket.emit('join-room', { roomName:r, userName:n, password:p });
  }

  socket.on('join-success', d => {
    document.getElementById('login').style.display='none';
    document.getElementById('st').className = 'status ok';
    document.getElementById('st-txt').innerText = "P2P ONLINE";
    document.getElementById('info').innerText = `ROOM: ${d.roomName}`;
    upd(d.users);
  });

  socket.on('error-msg', m => { document.getElementById('err').innerText = m; document.getElementById('st').className='status'; document.getElementById('st-txt').innerText = "ERROR"; });
  socket.on('user-left', id => { document.getElementById('u-'+id)?.remove(); if(peers[id]) { peers[id].pc.close(); delete peers[id]; } });
  
  // ----------------------------------------------------
  // WebRTC P2P 핵심 통신 로직
  // ----------------------------------------------------
  function setupPeerConnection(peerId, initiate) {
    const pc = new RTCPeerConnection(rtcConfig);
    peers[peerId] = { pc: pc, dataChannel: null };

    // ICE 캔디데이트(네트워크 길찾기) 교환
    pc.onicecandidate = event => {
      if (event.candidate) socket.emit('webrtc-signal', { to: peerId, signal: { candidate: event.candidate } });
    };

    // 상대방이 다이렉트로 보낸 미디 신호 받기!
    const setupDataChannel = (channel) => {
      peers[peerId].dataChannel = channel;
      channel.onmessage = event => {
        const [s, n, v] = JSON.parse(event.data);
        echoBlock[`${s}-${n}`] = Date.now(); // 루프 방지 장부 기록
        if(s===144 && v>0) play(n,v); else stop(n);
        flash(peerId);
        midiOutputs.forEach(output => { try { output.send([s, n, v]); } catch(e) {} });
      };
    };

    if (initiate) {
      const dc = pc.createDataChannel('midi');
      setupDataChannel(dc);
      pc.createOffer().then(offer => pc.setLocalDescription(offer))
        .then(() => socket.emit('webrtc-signal', { to: peerId, signal: { offer: pc.localDescription } }));
    } else {
      pc.ondatachannel = event => setupDataChannel(event.channel);
    }
  }

  // 누가 새로 들어오면 내가 먼저 연결 요청 (Offer)
  socket.on('user-joined', user => {
    addU(user);
    setupPeerConnection(user.id, true); 
  });

  // 연결 신호 핑퐁 처리
  socket.on('webrtc-signal', async data => {
    const { from, signal } = data;
    if (!peers[from]) setupPeerConnection(from, false);
    const pc = peers[from].pc;

    if (signal.offer) {
      await pc.setRemoteDescription(new RTCSessionDescription(signal.offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      socket.emit('webrtc-signal', { to: from, signal: { answer: pc.localDescription } });
    } else if (signal.answer) {
      await pc.setRemoteDescription(new RTCSessionDescription(signal.answer));
    } else if (signal.candidate) {
      await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
    }
  });

  function upd(us) { document.getElementById('users').innerHTML=''; us.forEach(addU); }
  function addU(u) {
    if(document.getElementById('u-'+u.id)) return;
    const d = document.createElement('div');
    d.className = 'u-card'; d.id='u-'+u.id; 
    d.innerHTML=`<span class="u-dot" id="d-${u.id}"></span>${u.name}`;
    document.getElementById('users').appendChild(d);
  }
  function flash(id) {
    const d = document.getElementById('d-'+id);
    if(d) { d.classList.add('act'); setTimeout(()=>d.classList.remove('act'), 100); }
  }
  
  if(navigator.requestMIDIAccess) {
    navigator.requestMIDIAccess().then(m => { 
      for(let i of m.inputs.values()) {
        i.onmidimessage = e => {
          const [s, n, v] = e.data;
          if (echoBlock[`${s}-${n}`] && Date.now() - echoBlock[`${s}-${n}`] < 300) return;
          tx(s, n, v);
        };
      }
      for(let o of m.outputs.values()) midiOutputs.push(o);
    });
  }
</script>
</body>
</html>
