<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Remote Piano - Flat Yellow</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
    body { background:#0a0a0a; color:#fff; display:flex; flex-direction:column; height:100vh; margin:0; overflow:hidden; font-family:'Inter', sans-serif; touch-action:none; }
    
    header { padding:15px 25px; display:flex; flex-direction:column; gap:10px; background:#111; border-bottom:1px solid #333; z-index:20; }
    .header-top { display:flex; justify-content:space-between; align-items:center; }
    .logo { font-size:20px; font-weight:900; color:#0f8; letter-spacing:1px; text-transform:uppercase; display:flex; align-items:center; gap:10px; }
    
    .auth-container { display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
    .control-group { display:flex; gap:8px; align-items:center; }
    input { padding:10px 14px; background:#1a1a1a; border:1px solid #333; color:#fff; border-radius:10px; font-size:13px; outline:none; width:120px; font-weight:600; }
    button { padding:10px 18px; border:none; border-radius:10px; font-weight:800; font-size:12px; cursor:pointer; text-transform:uppercase; transition: 0.2s; }
    .btn-create { background:#0f8; color:#000; }
    .btn-leave { background:#222; color:#ff4444; border:1px solid #333; }

    .lobby-area { display:flex; gap:10px; align-items:center; justify-content: flex-end; width: 100%; }
    #active-rooms { display:flex; gap:6px; }
    .room-tag { padding:4px 10px; background:#222; border-radius:6px; cursor:pointer; font-size:11px; color:#777; font-weight:700; }

    #main-container { flex:1; position:relative; display:flex; flex-direction:column; background:#000; overflow:hidden; }
    #visualizer { position:absolute; top:0; left:0; width:100%; height:calc(100% - 280px); pointer-events:none; z-index:1; }

    /* 🎹 피아노 디자인 - 간격 정밀 조정 */
    #piano-wrapper { position:absolute; bottom:0; left:50%; transform:translateX(-50%); padding:50px 20px 20px 20px; background:#161616; border-radius:12px 12px 0 0; box-shadow: 0 -20px 60px rgba(0,0,0,0.8); z-index:10; }
    #piano { display:flex; position:relative; background:#000; padding:2px; }
    .k { position:relative; cursor:pointer; transition: 0.05s; }

    /* 흰 건반: 간격 벌어짐 방지를 위해 -1px 마진 적용 */
    .w { width:42px; height:240px; background:#fff; border:1px solid #aaa; border-radius:0 0 4px 4px; z-index:1; margin-right: -1px; }
    
    /* 검은 건반 */
    .b { width:26px; height:150px; background:#222; margin:0 -13px; z-index:2; border-radius:0 0 2px 2px; border:1px solid #000; }

    /* 🟡 진한 노란색 점등 (광택 제거 버전) */
    .k.on { 
      background: #ffcc00 !important; 
      box-shadow: none !important;
      border-color: #d4aa00 !important;
      transform: translateY(4px); 
    }

    #users { padding:10px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; min-height:50px; }
    .u-card { background:#161616; padding:8px 16px; border-radius:20px; display:flex; align-items:center; gap:8px; border:1px solid #222; font-size:13px; font-weight:800; color:#ccc; }
    .u-dot { width:7px; height:7px; background:#333; border-radius:50%; }
    .u-dot.act { background:#0f8; box-shadow:0 0 10px #0f8; }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo"><span>🎹</span> SESSION PIANO</div>
    <div class="auth-container" id="login-form">
      <div class="control-group">
        <input id="rn" placeholder="Room Name">
        <input id="pw" type="text" placeholder="Password" maxlength="4">
        <input id="nm" placeholder="Name">
        <button class="btn-create" id="btn-action" onclick="createRoom()">CREATE</button>
      </div>
      <div class="lobby-area" id="lobby-wrap">
        <div id="active-rooms"></div>
      </div>
    </div>
    <div class="control-group" id="connected-ui" style="display:none;">
      <div id="room-name-display" style="font-weight:900; color:#0f8; margin-right:10px;"></div>
      <button id="mute-btn" style="background:#222; color:#888; border:1px solid #333;" onclick="toggleMute()">SOUND ON</button>
      <button class="btn-leave" onclick="location.reload()">EXIT</button>
    </div>
  </div>
</header>

<div id="users"></div>

<div id="main-container">
  <canvas id="visualizer"></canvas>
  <div id="piano-wrapper">
    <div id="piano"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const audio = new (window.AudioContext||window.webkitAudioContext)();
  const socket = io();
  const activeVoices = {}; 

  // --- 시각화 (진한 노란색 악보) ---
  const canvas = document.getElementById('visualizer');
  const ctx = canvas.getContext('2d');
  let notes = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight - 280;
  }
  window.addEventListener('resize', resize);
  resize();

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const now = Date.now();
    notes = notes.filter(n => {
      const elapsed = now - n.start;
      const y = canvas.height - (elapsed * 0.25);
      const height = n.end ? (n.end - n.start) * 0.25 : (now - n.start) * 0.25;
      ctx.fillStyle = '#ffcc00'; // 진한 노란색 통일
      ctx.fillRect(n.x, y - height, n.width, height);
      return y - height > -100;
    });
    requestAnimationFrame(animate);
  }
  animate();

  let isMuted = false;

  function play(n, v, remoteId = null) {
    const key = document.getElementById('k'+n);
    if(key) {
      key.classList.add('on');
      const rect = key.getBoundingClientRect();
      notes.push({ pitch: n, x: rect.left, width: rect.width, start: Date.now(), end: null });
    }
    if(remoteId) flash(remoteId); else flashMyDot(true);
    if(isMuted) { activeVoices[n] = { isDummy: true }; return; }
    
    const now = audio.currentTime;
    const b = audio.createOscillator();
    const g = audio.createGain();
    b.type = 'triangle';
    b.frequency.value = 440 * Math.pow(2, (n-69)/12);
    g.gain.setValueAtTime((v/127)*0.3, now);
    g.gain.exponentialRampToValueAtTime(0.01, now + 2);
    b.connect(g); g.connect(audio.destination);
    b.start();
    activeVoices[n] = { b, g };
  }

  function stop(n) {
    const key = document.getElementById('k'+n);
    if(key) key.classList.remove('on');
    const note = notes.find(nt => nt.pitch === n && !nt.end);
    if(note) note.end = Date.now();
    const v = activeVoices[n];
    if(v && !v.isDummy) {
      const now = audio.currentTime;
      v.g.gain.cancelScheduledValues(now);
      v.g.gain.linearRampToValueAtTime(0, now + 0.1);
      setTimeout(() => { v.b.stop(); v.g.disconnect(); }, 150);
    }
    delete activeVoices[n];
    if (Object.keys(activeVoices).length === 0) flashMyDot(false);
  }

  function tx(s, n, v) {
    if((s & 0xF0) === 0x90 && v > 0) play(n,v); 
    else if((s & 0xF0) === 0x80 || ((s & 0xF0) === 0x90 && v === 0)) stop(n);
    socket.emit('midi-msg', { roomName: window.currentRoom, msg: [s, n, v] });
  }

  const pEl = document.getElementById('piano');
  for(let i=21; i<=108; i++) {
    const isB = [1,3,6,8,10].includes(i%12);
    const d = document.createElement('div');
    d.id = 'k'+i; d.className = `k ${isB?'b':'w'}`;
    pEl.appendChild(d);
  }

  if (navigator.requestMIDIAccess) {
    navigator.requestMIDIAccess().then(a => {
      for (let i of a.inputs.values()) i.onmidimessage = (e) => tx(e.data[0], e.data[1], e.data[2]);
    });
  }

  function createRoom() {
    const r = document.getElementById('rn').value, n = document.getElementById('nm').value, p = document.getElementById('pw').value;
    if(!r || !n) return alert("Room name and Name are required!");
    window.currentRoom = r;
    socket.emit('create-room', { roomName: r, userName: n, password: p });
  }

  function toggleMute() {
    isMuted = !isMuted;
    const btn = document.getElementById('mute-btn');
    btn.innerText = isMuted ? "SOUND OFF" : "SOUND ON";
    btn.style.color = isMuted ? "#ff4444" : "#0f8";
  }

  socket.on('join-success', d => {
    document.getElementById('login-form').style.display = 'none';
    document.getElementById('connected-ui').style.display = 'flex';
    document.getElementById('room-name-display').innerText = d.roomName;
    upd(d.users);
  });
  socket.on('remote-midi', d => {
    const [s,n,v] = d.msg;
    if((s & 0xF0) === 0x90 && v > 0) play(n,v,d.id); else stop(n);
  });
  socket.on('room-list', rs => {
    const c = document.getElementById('active-rooms');
    c.innerHTML = ''; rs.forEach(r => {
      const b = document.createElement('div'); b.className='room-tag'; b.innerText=r;
      b.onclick=()=>{document.getElementById('rn').value=r; document.getElementById('btn-action').innerText="JOIN";};
      c.appendChild(b);
    });
  });

  function upd(us) { 
    document.getElementById('users').innerHTML=''; 
    us.forEach(u=>{
      const d=document.createElement('div'); d.className='u-card'; d.id='u-'+u.id;
      d.innerHTML=`<span class="u-dot" id="d-${u.id}"></span>${u.name.toUpperCase()}`;
      document.getElementById('users').appendChild(d);
    });
  }
  function flashMyDot(a) { const d=document.getElementById('d-'+socket.id); if(d) a?d.classList.add('act'):d.classList.remove('act'); }
  function flash(id) { const d=document.getElementById('d-'+id); if(d){ d.classList.add('act'); setTimeout(()=>d.classList.remove('act'),100);}}
</script>
</body>
</html>
