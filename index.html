<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Remote Piano</title>
  <style>
    body { background:#111; color:#fff; display:flex; flex-direction:column; height:100vh; margin:0; overflow:hidden; font-family:sans-serif; touch-action:none; }
    
    /* 상단 메뉴바 및 접속 컨트롤 */
    header { padding:15px 25px; display:flex; justify-content:space-between; align-items:center; background:#1a1a1a; border-bottom:1px solid #333; z-index:10; box-shadow:0 4px 10px rgba(0,0,0,0.5); }
    .logo { font-size:22px; font-weight:bold; color:#0f8; letter-spacing:1px; }
    
    .control-group { display:flex; gap:10px; align-items:center; }
    input { padding:10px 15px; background:#222; border:1px solid #444; color:#fff; border-radius:5px; font-size:14px; outline:none; transition:0.2s; }
    input:focus { border-color:#0f8; }
    button { padding:10px 20px; border:none; border-radius:5px; font-weight:bold; font-size:14px; cursor:pointer; transition:0.2s; }
    .btn-join { background:#0f8; color:#000; }
    .btn-join:hover { background:#0c6; }
    .btn-leave { background:#ff4444; color:#fff; }
    .btn-leave:hover { background:#cc0000; }

    /* 상태 표시 대시보드 */
    .status-wrap { display:flex; align-items:center; gap:15px; background:rgba(0,0,0,0.5); padding:8px 15px; border-radius:10px; border:1px solid #333; }
    .net-info { text-align:right; display:flex; flex-direction:column; gap:3px; }
    #net-mode { font-size:12px; font-weight:bold; color:#888; }
    #net-ping { font-size:14px; font-weight:bold; color:#888; font-family:monospace; }
    
    /* 접속한 유저 목록 (크게 변경) */
    #users { padding:20px; display:flex; gap:20px; flex-wrap:wrap; justify-content:center; min-height:40px; }
    .u-card { background:#2a2a2a; padding:12px 25px; border-radius:30px; display:flex; align-items:center; gap:10px; border:1px solid #555; font-size:18px; font-weight:bold; box-shadow:0 4px 6px rgba(0,0,0,0.3); }
    .u-dot { width:12px; height:12px; background:#555; border-radius:50%; transition:0.1s; }
    .u-dot.act { background:#0f8; box-shadow:0 0 10px #0f8; transform:scale(1.3); }
    
    /* 피아노 건반 위치 상향 및 정렬 */
    #piano { flex:1; display:flex; align-items:flex-start; padding-top:60px; justify-content:center; position:relative; overflow-x:auto; background:linear-gradient(to bottom, #111, #050505); }
    .k { position:relative; border-radius:0 0 5px 5px; cursor:pointer; transition:transform 0.05s, background 0.05s; }
    .w { width:38px; height:240px; background:#fff; border:1px solid #ccc; z-index:1; }
    .w:active, .w.on { background:#ffe600; box-shadow:0 0 15px rgba(255,230,0,0.5); transform:translateY(2px); }
    
    /* 검은 건반 누를 때 노란색으로 빛나게 수정 */
    .b { width:24px; height:150px; background:#000; margin:0 -12px 90px -12px; z-index:2; border:1px solid #222; }
    .b:active, .b.on { background:#ffe600 !important; box-shadow:0 0 15px rgba(255,230,0,0.5); transform:translateY(2px); }
  </style>
</head>
<body>

<header>
  <div class="logo">🎹 Remote Piano</div>
  
  <div class="control-group" id="login-form">
    <input id="rn" placeholder="방 이름 (예: 합주실)">
    <input id="pw" type="password" placeholder="비밀번호">
    <input id="nm" placeholder="닉네임">
    <button class="btn-join" onclick="join()">접속</button>
  </div>
  
  <div class="control-group" id="connected-ui" style="display:none;">
    <div class="status-wrap" id="dash">
      <div class="net-info">
        <div id="net-mode">통신상태: 대기중</div>
        <div id="net-ping">-- ms</div>
      </div>
    </div>
    <button class="btn-leave" onclick="location.reload()">접속 끊기</button>
  </div>
</header>

<div id="users"></div>
<div id="piano"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const audio = new (window.AudioContext||window.webkitAudioContext)();
  const socket = io();
  const oscs = {}, gains = {};
  let midiOutputs = []; 
  const echoBlock = {}; 

  const peers = {}; 
  const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }; 

  // 마우스 글리산도(드래그)를 위한 전역 상태
  let isDragging = false;
  document.addEventListener('mousedown', () => isDragging = true);
  document.addEventListener('mouseup', () => isDragging = false);
  document.addEventListener('touchstart', () => isDragging = true);
  document.addEventListener('touchend', () => isDragging = false);

  // 초정밀 오디오 엔진 (지연 최소화, 빠른 반복 터치 대응)
  function play(n, v) {
    if(oscs[n]) stop(n);
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = 'triangle';
    o.frequency.value = 440 * Math.pow(2, (n-69)/12);
    const vol = (v/127) * 0.5;
    
    g.gain.setValueAtTime(0, audio.currentTime);
    g.gain.linearRampToValueAtTime(vol, audio.currentTime + 0.005); // Attack을 더 빠르게
    g.gain.exponentialRampToValueAtTime(vol * 0.1, audio.currentTime + 1.5);
    
    o.connect(g); g.connect(audio.destination);
    o.start();
    oscs[n]=o; gains[n]=g;
    
    const k = document.getElementById('k'+n);
    if(k) k.classList.add('on');
  }

  function stop(n) {
    if(gains[n]) {
      gains[n].gain.cancelScheduledValues(audio.currentTime);
      gains[n].gain.setValueAtTime(gains[n].gain.value, audio.currentTime);
      gains[n].gain.linearRampToValueAtTime(0, audio.currentTime + 0.03); // 잔향 끊기 고속화
    }
    const o = oscs[n];
    setTimeout(()=>{ if(o) { o.stop(); o.disconnect(); } }, 40);
    delete oscs[n]; delete gains[n];
    
    const k = document.getElementById('k'+n);
    if(k) k.classList.remove('on');
  }

  function tx(s, n, v) {
    if(audio.state === 'suspended') audio.resume();
    if(s===144 && v>0) play(n,v); else stop(n);
    
    let sentP2P = false;
    const msgStr = JSON.stringify([s, n, v]);
    
    for (const peerId in peers) {
      const channel = peers[peerId].dataChannel;
      if (channel && channel.readyState === 'open') {
        channel.send(msgStr);
        sentP2P = true;
      }
    }
    if (!sentP2P && window.currentRoom) socket.emit('midi-msg', { roomName: window.currentRoom, msg: [s, n, v] });
  }

  const p = document.getElementById('piano');
  for(let i=21; i<=108; i++) {
    const isB = [1,3,6,8,10].includes(i%12);
    const d = document.createElement('div');
    d.id = 'k'+i; d.className = `k ${isB?'b':'w'}`;
    
    // 마우스 누름, 떼기 및 드래그(글리산도) 로직
    d.addEventListener('mousedown', (e) => { e.preventDefault(); tx(144, i, 100); });
    d.addEventListener('mouseenter', (e) => { e.preventDefault(); if(isDragging) tx(144, i, 100); });
    d.addEventListener('mouseleave', (e) => { e.preventDefault(); tx(128, i, 0); });
    d.addEventListener('mouseup', (e) => { e.preventDefault(); tx(128, i, 0); });
    
    p.appendChild(d);
  }

  // 모바일 터치 글리산도 처리 (화면 긁을 때 연주)
  let currentTouchNote = null;
  document.addEventListener('touchmove', (e) => {
    if(!isDragging) return;
    const touch = e.touches[0];
    const elem = document.elementFromPoint(touch.clientX, touch.clientY);
    if(elem && elem.classList.contains('k')) {
      const note = parseInt(elem.id.replace('k',''));
      if(currentTouchNote !== note) {
        if(currentTouchNote) tx(128, currentTouchNote, 0);
        currentTouchNote = note;
        tx(144, note, 100);
      }
    }
  }, {passive: false});
  document.addEventListener('touchend', () => {
    if(currentTouchNote) { tx(128, currentTouchNote, 0); currentTouchNote = null; }
  });

  function join() {
    const r = document.getElementById('rn').value, pw = document.getElementById('pw').value, n = document.getElementById('nm').value;
    if(!r || !pw || !n) { alert("방 이름, 비밀번호, 닉네임을 모두 입력해주세요!"); return; }
    if(audio.state==='suspended') audio.resume();
    
    document.getElementById('net-mode').innerText = "접속 중...";
    socket.emit('join-room', { roomName:r, userName:n, password:pw });
    window.currentRoom = r;
  }

  socket.on('join-success', d => {
    // UI 변경 (폼 숨기고, 대시보드 노출)
    document.getElementById('login-form').style.display = 'none';
    document.getElementById('connected-ui').style.display = 'flex';
    upd(d.users);
  });

  socket.on('error-msg', m => { alert(m); document.getElementById('net-mode').innerText = "대기중"; });
  socket.on('user-left', id => { document.getElementById('u-'+id)?.remove(); if(peers[id]) { peers[id].pc.close(); delete peers[id]; } });

  socket.on('remote-midi', d => { 
    const [s,n,v] = d.msg; 
    echoBlock[`${s}-${n}`] = Date.now(); 
    if(s===144 && v>0) play(n,v); else stop(n); 
    flash(d.id); 
    midiOutputs.forEach(output => { try { output.send([s, n, v]); } catch(e) {} });
  });

  socket.on('user-activity', d => flash(d.id));

  // ----------------------------------------------------
  // 한국어 네트워크 상태 표시 (좋음, 중간, 나쁨)
  // ----------------------------------------------------
  function updatePing(ms) {
    const pingEl = document.getElementById('net-ping');
    const modeEl = document.getElementById('net-mode');
    pingEl.innerText = ms + " ms";
    
    if(ms < 50) {
      modeEl.innerText = "통신상태: 좋음 🟢";
      modeEl.style.color = "#0f8"; pingEl.style.color = "#0f8";
    } else if(ms < 150) {
      modeEl.innerText = "통신상태: 중간 🟡";
      modeEl.style.color = "#ffeb3b"; pingEl.style.color = "#ffeb3b";
    } else {
      modeEl.innerText = "통신상태: 나쁨 🔴";
      modeEl.style.color = "#ff4444"; pingEl.style.color = "#ff4444";
    }
  }

  socket.on('ping-res', t => updatePing(Date.now() - t));

  setInterval(() => {
    if(!window.currentRoom) return;
    let p2pActive = false;
    for(const p in peers) {
      if(peers[p].dataChannel && peers[p].dataChannel.readyState === 'open') p2pActive = true;
    }
    
    const now = Date.now();
    if(p2pActive) {
      for(const p in peers) {
        const dc = peers[p].dataChannel;
        if(dc && dc.readyState === 'open') dc.send(JSON.stringify(['ping', now]));
      }
    } else {
      socket.emit('ping-req', now);
    }
  }, 2000);

  // WebRTC P2P 통신
  function setupPeerConnection(peerId, initiate) {
    const pc = new RTCPeerConnection(rtcConfig);
    peers[peerId] = { pc: pc, dataChannel: null };

    pc.onicecandidate = event => {
      if (event.candidate) socket.emit('webrtc-signal', { to: peerId, signal: { candidate: event.candidate } });
    };

    const setupDataChannel = (channel) => {
      peers[peerId].dataChannel = channel;
      channel.onmessage = event => {
        const data = JSON.parse(event.data);
        if(typeof data[0] === 'string') {
          if(data[0] === 'ping') channel.send(JSON.stringify(['pong', data[1]]));
          else if(data[0] === 'pong') updatePing(Date.now() - data[1]);
          return;
        }
        const [s, n, v] = data;
        echoBlock[`${s}-${n}`] = Date.now(); 
        if(s===144 && v>0) play(n,v); else stop(n);
        flash(peerId);
        midiOutputs.forEach(output => { try { output.send([s, n, v]); } catch(e) {} });
      };
    };

    if (initiate) {
      const dc = pc.createDataChannel('midi');
      setupDataChannel(dc);
      pc.createOffer().then(offer => pc.setLocalDescription(offer))
        .then(() => socket.emit('webrtc-signal', { to: peerId, signal: { offer: pc.localDescription } }));
    } else {
      pc.ondatachannel = event => setupDataChannel(event.channel);
    }
  }

  socket.on('user-joined', user => { addU(user); setupPeerConnection(user.id, true); });

  socket.on('webrtc-signal', async data => {
    const { from, signal } = data;
    if (!peers[from]) setupPeerConnection(from, false);
    const pc = peers[from].pc;
    if (signal.offer) {
      await pc.setRemoteDescription(new RTCSessionDescription(signal.offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      socket.emit('webrtc-signal', { to: from, signal: { answer: pc.localDescription } });
    } else if (signal.answer) {
      await pc.setRemoteDescription(new RTCSessionDescription(signal.answer));
    } else if (signal.candidate) {
      await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
    }
  });

  function upd(us) { document.getElementById('users').innerHTML=''; us.forEach(addU); }
  function addU(u) {
    if(document.getElementById('u-'+u.id)) return;
    const d = document.createElement('div');
    d.className = 'u-card'; d.id='u-'+u.id; 
    d.innerHTML=`<span class="u-dot" id="d-${u.id}"></span>${u.name}`;
    document.getElementById('users').appendChild(d);
  }
  function flash(id) {
    const d = document.getElementById('d-'+id);
    if(d) { d.classList.add('act'); setTimeout(()=>d.classList.remove('act'), 100); }
  }
  
  if(navigator.requestMIDIAccess) {
    navigator.requestMIDIAccess().then(m => { 
      for(let i of m.inputs.values()) {
        i.onmidimessage = e => {
          const [s, n, v] = e.data;
          // 메아리 차단 로직 시간을 100ms로 줄여서 연타(빠른 동일노트 입력)가 안 씹히도록 개선
          if (echoBlock[`${s}-${n}`] && Date.now() - echoBlock[`${s}-${n}`] < 100) return;
          tx(s, n, v);
        };
      }
      for(let o of m.outputs.values()) midiOutputs.push(o);
    });
  }
</script>
</body>
</html>
